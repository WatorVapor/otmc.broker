global
    log stdout format raw local0 debug
    lua-load /usr/local/etc/haproxy/lua/auth.lua   # 加载 Lua 脚本

defaults
    mode tcp
    timeout connect 10s
    timeout client 30s
    timeout server 30s

frontend mqtt_frontend
    bind :::8443 ssl crt /etc/haproxy/certs/server.pem ca-file /etc/haproxy/certs/ca.crt verify required
    option tcplog
    log-format "Client Cert Chain: %{+Q}[ssl_c_chain]"

    # 1. 将证书链存入变量
    tcp-request content set-var(txn.client_chain) ssl_c_chain

    # 2. 调用 Lua 进行外部鉴权
    tcp-request content lua.auth_by_nodejs

    # 3. 如果鉴权失败，拒绝连接
    tcp-request content reject if ! { var(txn.auth_ok) -m bool }

    default_backend mqtt_backend

backend mqtt_backend
    server mqtt1 mosquitto:1883