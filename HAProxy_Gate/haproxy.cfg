global
    log stdout format raw local0 debug
    tune.lua.bool-sample-conversion pre-3.1-bug   # 消除 Lua 版本警告
    lua-prepend-path /usr/local/etc/haproxy/lua/?.lua
    lua-load /usr/local/etc/haproxy/lua/mqtt_route.lua
    tune.lua.session-timeout 5s

defaults
    mode tcp
    timeout connect 10s
    timeout client 300s
    timeout server 300s

frontend mqtt_gateway
    bind :::8883 ssl crt /usr/local/etc/certs/server_cert/fullchain.crt ca-file /usr/local/etc/certs/client_cert/ca_bundle.crt verify required
    option tcplog
    log global                                  # 开启日志
    #log-format "Client Cert Chain: %{+Q}[ssl_c_chain]"
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content lua.process_mqtt_connect
    tcp-request content reject if { var(txn.reject) -m bool }

    use_backend %[var(txn.mqtt_backend)] if { var(txn.mqtt_backend) -m found }

    default_backend mqtt_backend_reject                # 与后端名称一致

backend mqtt_backend_internal_01
    mode tcp
    #server mqtt_broker_internal 0.0.0.0:0 ssl ca-file /usr/local/etc/certs/internal_cert/internal-root.crt crt /usr/local/etc/certs/internal_cert/internal-client.crt.key.pem verify required
    server mqtt_broker_internal 2404:7a82:1be9:3f00:96c6:91ff:fea6:7bd0:18883 ssl ca-file /usr/local/etc/certs/internal_cert/internal-root.crt crt /usr/local/etc/certs/internal_cert/internal-client.crt.key.pem verify required
    #server mqtt_broker_internal 0.0.0.0:0 


backend mqtt_backend_reject
    mode tcp
    #server mqtt_broker_reject

listen redis_local_proxy_1
    bind 127.0.0.1:16379
    mode tcp
    option tcplog
    log global
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    default_backend redis_mtls_backend_1

backend redis_mtls_backend_1
    mode tcp
    server redis_node valkey-cluster-conoha-pdf-coltd.wator.xyz:6379 ssl ca-file /usr/local/etc/certs/valkey-cluster/valkey-root.crt crt /usr/local/etc/certs/valkey-cluster/valkey-client-private-key.pem verify required     

listen redis_local_proxy_2
    bind 127.0.0.1:16380
    mode tcp
    option tcplog
    log global
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    default_backend redis_mtls_backend_2

backend redis_mtls_backend_2
    mode tcp
    server redis_node valkey-cluster-conoha-wator.wator.xyz:6379 ssl ca-file /usr/local/etc/certs/valkey-cluster/valkey-root.crt crt /usr/local/etc/certs/valkey-cluster/valkey-client-private-key.pem verify required
     
listen redis_local_proxy_3
    bind 127.0.0.1:16381
    mode tcp
    option tcplog
    log global
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    default_backend redis_mtls_backend_3

backend redis_mtls_backend_3
    mode tcp
    server redis_node valkey-cluster-conoha-ndhealth.wator.xyz:6379 ssl ca-file /usr/local/etc/certs/valkey-cluster/valkey-root.crt crt /usr/local/etc/certs/valkey-cluster/valkey-client-private-key.pem verify required
     
