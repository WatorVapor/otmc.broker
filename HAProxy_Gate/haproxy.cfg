global
    log stdout format raw local0 debug
    lua-load /usr/local/etc/haproxy/lua/mqtt_route.lua   # 加载 Lua 脚本
    tune.lua.session-timeout 5s

defaults
    mode tcp
    timeout connect 10s
    timeout client 30s
    timeout server 30s

frontend mqtt_gateway
    bind :::8443 ssl crt /etc/haproxy/certs/server.pem ca-file /etc/haproxy/certs/ca.crt verify required
    option tcplog
    log-format "Client Cert Chain: %{+Q}[ssl_c_chain]"
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content lua.process_mqtt_connect
    tcp-request content accept if { ssl_c_used }
    tcp-request content reject if { var(txn.reject) -m bool }
    default_backend bk_mqtt

backend mqtt_backend
    mode tcp
    server mqtt_broker 0.0.0.0:0 send-proxy-v2 proxy-v2-options ssl