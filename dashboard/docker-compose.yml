services:
  nginx-inner:
    image: nginx:mainline
    container_name: otmc-nginx-dashboard
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/www
      - /dev/shm/otmc-dashboard:/var/run/otmc
      - /watorvapor/ecdsa-cert/certbot/etc:/etc/cert:ro
      - /watorvapor/log/nginx:/log
    network_mode : "host"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 32M

