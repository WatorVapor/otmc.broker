# 定义 upstream，便于 keepalive 连接复用（unix socket 也有意义）
upstream dashboard_backend_app {
    server localhost:5173;
    #server unix:/var/run/otmc/dashboard.sock;   # ← 改成你的实际 socket 路径
    keepalive 32;
}

upstream dashboard_backend_ws {
    server localhost:5173;
    #server unix:/var/run/otmc/dashboard.sock;   # ← 改成你的实际 socket 路径
    keepalive 32;
}


# HTTPS server
server {
  listen       10443 ssl;
  listen       [::]:10443 ssl;
  listen       10443 quic;
  listen       [::]:10443 quic;

  http3        on;
  http2        on;
  ssl_certificate      /etc/cert/live/wator.xyz/fullchain.pem;
  ssl_certificate_key  /etc/cert/live/wator.xyz/privkey.pem;
  ssl_session_timeout  30m;
  ssl_protocols        TLSv1.2 TLSv1.3;
  port_in_redirect off;

  # ✅ 全局：所有响应都禁止浏览器/中间层缓存
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma "no-cache" always;
  #add_header Alt-Svc 'h3=":10443"; ma=86400' always;

  location ^~ / {
    proxy_pass http://dashboard_backend_app;
    # 标准反代头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

  }

  location = /__vite_hmr {
    proxy_pass http://dashboard_backend_ws;
    # 标准反代头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ✅ WebSocket 升级必需的头
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

  }
}
