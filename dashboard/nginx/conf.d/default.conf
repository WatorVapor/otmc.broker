upstream space_api_backend {
    server unix:/var/run/otmc/space.api.sock;
    keepalive 32;
}

server {
  listen       10443 ssl;
  listen       [::]:10443 ssl;
  listen       10443 quic;
  listen       [::]:10443 quic;

  http3        on;
  http2        on;
  ssl_certificate      /etc/cert/live/wator.xyz/fullchain.pem;
  ssl_certificate_key  /etc/cert/live/wator.xyz/privkey.pem;
  ssl_session_timeout  30m;
  ssl_protocols        TLSv1.2 TLSv1.3;
  port_in_redirect off;

  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Alt-Svc 'h3=":10443"; ma=86400' always;

  location / {
      root /www;
      index index.html;
      try_files $uri $uri/ /index.html;
  }

  # 精确匹配根路径，补尾斜杠后进下面的 location
  #location = /api/v1/space {
  #    return 308 /api/v1/space/;
  #}

  location /api/v1/space {
      # ① 带尾斜杠：去尾斜杠 + 剥前缀
      rewrite ^/api/v1/space/(.*)/$ /$1 break;
      # ② 无尾斜杠：只剥前缀
      rewrite ^/api/v1/space/(.*)$  /$1 break;

      # ⚠️ 关键：proxy_pass 不带 URI（没有尾斜杠），
      #    这样 nginx 会直接转发 rewrite 后的 URI，不受"URI 被忽略"规则影响
      proxy_pass http://space_api_backend;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  $server_port;
  }
}
