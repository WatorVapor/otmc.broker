<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Dashboard · MQTT over WebSocket</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ant-design-vue@4.2.6/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ant-design-vue@4.2.6/dist/antd.min.css" />

    <style>
        html, body, #app { height: 100%; margin: 0; background: #f0f2f5; }
        .logo {
            height: 32px; margin: 16px; color: #fff; font-weight: 600; font-size: 15px;
            text-align: center; line-height: 32px; letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.18); border-radius: 6px;
            white-space: nowrap; overflow: hidden;
        }
        .site-header {
            background: #fff; padding: 0 24px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 1px 4px rgba(0, 21, 41, 0.08);
        }
        .stat-card .ant-card-body { padding: 18px 22px; }
        .stat-label { color: #8c8c8c; font-size: 13px; margin-bottom: 6px; }
        .stat-value { font-size: 26px; font-weight: 600; color: #1f1f1f; line-height: 1.2; }
        .chart-box { height: 320px; width: 100%; }
        .live-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 6px; animation: pulse 1.4s infinite;
        }
        .live-dot.on  { background: #52c41a; }
        .live-dot.off { background: #bfbfbf; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.3); }
        }
        .ant-layout-content { padding: 24px; }
        .conn-form .ant-form-item { margin-bottom: 12px; }
        .msg-log {
            background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace;
            font-size: 12px; line-height: 1.6; padding: 12px; border-radius: 6px;
            height: 220px; overflow-y: auto;
        }
        .msg-log .t { color: #569cd6; }
        .msg-log .tp { color: #4ec9b0; }
        .msg-log .err { color: #f48771; }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- ========== 依赖加载顺序（重要） ========== -->
    <!-- 1. Day.js + 插件 -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/customParseFormat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/localeData.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekOfYear.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekYear.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/advancedFormat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/quarterOfYear.js"></script>
    <script>
        dayjs.extend(dayjs_plugin_customParseFormat);
        dayjs.extend(dayjs_plugin_weekday);
        dayjs.extend(dayjs_plugin_localeData);
        dayjs.extend(dayjs_plugin_weekOfYear);
        dayjs.extend(dayjs_plugin_weekYear);
        dayjs.extend(dayjs_plugin_advancedFormat);
        dayjs.extend(dayjs_plugin_quarterOfYear);
    </script>

    <!-- 2. Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

    <!-- 3. ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

    <!-- 4. MQTT.js（浏览器端全局变量 mqtt） -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- 5. Ant Design Vue（暴露全局变量 antd） -->
    <script src="https://cdn.jsdelivr.net/npm/ant-design-vue@4.2.6/dist/antd.min.js"></script>

    <script>
        const { createApp, ref, reactive, onMounted, onBeforeUnmount } = Vue;

        const app = createApp({
            setup() {
                /* ---------------- MQTT 连接配置 ---------------- */
                const connectForm = reactive({
                    url: 'ws://broker.emqx.io:8083/mqtt', // 公共 EMQX Broker（仅测试用）
                    clientId: 'iot_dash_' + Math.random().toString(16).slice(2, 10),
                    username: '',
                    password: '',
                    subTopic: 'iot/demo/sensor/data',
                    pubTopic: 'iot/demo/sensor/control',
                });

                const connected = ref(false);
                const connecting = ref(false);
                const autoRefresh = ref(true);
                let mqttClient = null;

                // 消息日志
                const logs = reactive([]);

                /* ---------------- 业务状态 ---------------- */
                const summary = reactive({
                    online: 0,
                    offline: 0,
                    alerts: 0,
                    throughput: 0,
                });

                const timeLabels = ref([]);
                const tempData = ref([]);
                const humData = ref([]);

                const devices = reactive([]);
                const alerts = reactive([]);

                // 手动发布消息
                const pubMessage = ref('{"cmd":"led","value":1}');

                /* ---------------- 工具函数 ---------------- */
                const statusColor = (s) => ({ online: 'green', warning: 'orange', offline: 'red' }[s] || 'default');
                const statusText  = (s) => ({ online: '在线', warning: '告警', offline: '离线' }[s] || s);
                const levelColor  = (l) => ({ critical: 'red', warning: 'orange', info: 'blue' }[l] || 'default');
                const levelText   = (l) => ({ critical: '严重', warning: '警告', info: '提示' }[l] || l);

                const addLog = (type, text) => {
                    logs.push({ key: Date.now() + Math.random(), time: dayjs().format('HH:mm:ss'), type, text });
                    if (logs.length > 200) logs.shift();
                };

                /* ---------------- 图表配置 ---------------- */
                const lineRef = ref(null);
                const donutRef = ref(null);
                let lineChart = null;
                let donutChart = null;

                const lineOption = () => ({
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['温度 (°C)', '湿度 (%)'], top: 0 },
                    grid: { left: 46, right: 52, top: 44, bottom: 30 },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: timeLabels.value,
                        axisLabel: { fontSize: 11, color: '#8c8c8c' },
                    },
                    yAxis: [
                        { type: 'value', name: '°C', min: 15, max: 40, nameTextStyle: { color: '#8c8c8c' }, splitLine: { lineStyle: { type: 'dashed' } } },
                        { type: 'value', name: '%',  min: 30, max: 80, nameTextStyle: { color: '#8c8c8c' }, splitLine: { show: false } },
                    ],
                    series: [
                        {
                            name: '温度 (°C)', type: 'line', smooth: true, symbol: 'none',
                            data: tempData.value,
                            lineStyle: { width: 2, color: '#fa541c' },
                            itemStyle: { color: '#fa541c' },
                            areaStyle: { color: 'rgba(250,84,28,0.10)' },
                        },
                        {
                            name: '湿度 (%)', type: 'line', smooth: true, symbol: 'none', yAxisIndex: 1,
                            data: humData.value,
                            lineStyle: { width: 2, color: '#1677ff' },
                            itemStyle: { color: '#1677ff' },
                            areaStyle: { color: 'rgba(22,119,255,0.10)' },
                        },
                    ],
                });

                const donutOption = () => {
                    const total = summary.online + summary.offline;
                    const rate = total ? ((summary.online / total) * 100).toFixed(1) : '0.0';
                    return {
                        tooltip: { trigger: 'item', formatter: '{b}: {c} 台 ({d}%)' },
                        legend: { bottom: 0, icon: 'circle', itemWidth: 8, itemHeight: 8 },
                        title: {
                            text: rate + '%',
                            subtext: '在线率',
                            left: 'center',
                            top: '34%',
                            textStyle: { fontSize: 26, fontWeight: 600, color: '#1f1f1f' },
                            subtextStyle: { fontSize: 12, color: '#8c8c8c' },
                        },
                        series: [{
                            type: 'pie',
                            radius: ['58%', '78%'],
                            center: ['50%', '44%'],
                            avoidLabelOverlap: false,
                            label: { show: false },
                            labelLine: { show: false },
                            data: [
                                { value: summary.online || 1,  name: '在线', itemStyle: { color: '#52c41a' } },
                                { value: summary.offline, name: '离线', itemStyle: { color: '#ff4d4f' } },
                            ],
                        }],
                    };
                };

                /* ---------------- MQTT 连接与消息处理 ---------------- */
                const connectMQTT = () => {
                    if (mqttClient) {
                        try { mqttClient.end(true); } catch (e) {}
                        mqttClient = null;
                    }

                    connecting.value = true;
                    addLog('info', `正在连接 ${connectForm.url} …`);

                    const options = {
                        clean: true,
                        connectTimeout: 8000,
                        reconnectPeriod: 4000,
                        clientId: connectForm.clientId,
                    };
                    if (connectForm.username) options.username = connectForm.username;
                    if (connectForm.password) options.password = connectForm.password;

                    mqttClient = mqtt.connect(connectForm.url, options);

                    mqttClient.on('connect', () => {
                        connected.value = true;
                        connecting.value = false;
                        addLog('info', 'MQTT 连接成功');

                        mqttClient.subscribe(connectForm.subTopic, { qos: 0 }, (err) => {
                            if (err) {
                                addLog('err', `订阅失败: ${err.message}`);
                            } else {
                                addLog('info', `已订阅 Topic: ${connectForm.subTopic}`);
                            }
                        });
                    });

                    mqttClient.on('reconnect', () => {
                        connecting.value = true;
                        addLog('info', '正在重连 …');
                    });

                    mqttClient.on('close', () => {
                        if (connected.value) addLog('err', 'MQTT 连接已断开');
                        connected.value = false;
                        connecting.value = false;
                    });

                    mqttClient.on('error', (err) => {
                        addLog('err', `MQTT 错误: ${err.message}`);
                        connecting.value = false;
                    });

                    mqttClient.on('message', (topic, payload) => {
                        let text;
                        try {
                            text = payload.toString();
                        } catch (e) {
                            text = '[无法解析的 payload]';
                        }

                        addLog('recv', `[${topic}] ${text}`);

                        // 尝试按 JSON 解析，提取温湿度数据
                        try {
                            const data = JSON.parse(text);
                            handleSensorData(topic, data);
                        } catch (e) {
                            // 非 JSON 消息只记录，不更新图表
                        }
                    });
                };

                const disconnectMQTT = () => {
                    if (mqttClient) {
                        mqttClient.end(true);
                        mqttClient = null;
                    }
                    connected.value = false;
                    connecting.value = false;
                    addLog('info', '已主动断开连接');
                };

                // 处理传感器数据：兼容多种常见字段命名
                const handleSensorData = (topic, data) => {
                    const now = dayjs().format('HH:mm:ss');

                    const temp = data.temperature ?? data.temp ?? data.t;
                    const hum  = data.humidity ?? data.hum ?? data.h;

                    if (temp !== undefined || hum !== undefined) {
                        timeLabels.value.push(now);
                        tempData.value.push(temp !== undefined ? Number(temp) : null);
                        humData.value.push(hum !== undefined ? Number(hum) : null);

                        if (timeLabels.value.length > 20) {
                            timeLabels.value.shift();
                            tempData.value.shift();
                            humData.value.shift();
                        }

                        if (lineChart) {
                            lineChart.setOption({
                                xAxis: { data: timeLabels.value },
                                series: [{ data: tempData.value }, { data: humData.value }],
                            });
                        }

                        // 更新顶部概览
                        summary.throughput = Math.floor(Math.random() * 50) + 50; // 示意值
                    }

                    // 如果消息里带了设备状态，更新设备列表
                    if (data.deviceId || data.device_id) {
                        const id = data.deviceId || data.device_id;
                        const existing = devices.find((d) => d.id === id);
                        if (existing) {
                            if (temp !== undefined) existing.temp = Number(temp);
                            if (hum !== undefined) existing.hum = Number(hum);
                            existing.lastSeen = '刚刚';
                            existing.status = data.status || existing.status;
                        } else {
                            devices.push({
                                key: id,
                                id,
                                type: data.type || '传感器',
                                location: data.location || '—',
                                status: data.status || 'online',
                                temp: temp !== undefined ? Number(temp) : null,
                                hum: hum !== undefined ? Number(hum) : null,
                                lastSeen: '刚刚',
                            });
                        }
                        refreshSummary();
                    }

                    // 如果消息里带了告警信息，追加到告警列表
                    if (data.alert) {
                        alerts.unshift({
                            key: Date.now(),
                            level: data.alertLevel || data.alert_level || 'info',
                            device: data.deviceId || data.device_id || '—',
                            message: data.alert,
                            time: now,
                        });
                        if (alerts.length > 20) alerts.pop();
                        summary.alerts = alerts.length;
                    }
                };

                const refreshSummary = () => {
                    const total = devices.length;
                    const online = devices.filter((d) => d.status === 'online').length;
                    summary.online = online;
                    summary.offline = total - online;
                    if (donutChart) donutChart.setOption(donutOption());
                };

                /* ---------------- 发布消息 ---------------- */
                const publishMessage = () => {
                    if (!mqttClient || !connected.value) {
                        addLog('err', '未连接，无法发布');
                        return;
                    }
                    const topic = connectForm.pubTopic;
                    mqttClient.publish(topic, pubMessage.value, { qos: 0 }, (err) => {
                        if (err) {
                            addLog('err', `发布失败: ${err.message}`);
                        } else {
                            addLog('send', `[${topic}] ${pubMessage.value}`);
                        }
                    });
                };

                /* ---------------- 生命周期 ---------------- */
                onMounted(() => {
                    lineChart = echarts.init(lineRef.value);
                    lineChart.setOption(lineOption());

                    donutChart = echarts.init(donutRef.value);
                    donutChart.setOption(donutOption());

                    window.addEventListener('resize', handleResize);
                    connectMQTT();
                });

                onBeforeUnmount(() => {
                    window.removeEventListener('resize', handleResize);
                    if (lineChart) lineChart.dispose();
                    if (donutChart) donutChart.dispose();
                    if (mqttClient) mqttClient.end(true);
                });

                const handleResize = () => {
                    if (lineChart) lineChart.resize();
                    if (donutChart) donutChart.resize();
                };

                /* ---------------- 表格列定义 ---------------- */
                const columns = [
                    { title: '设备 ID', dataIndex: 'id', key: 'id', width: 110 },
                    { title: '类型', dataIndex: 'type', key: 'type' },
                    { title: '位置', dataIndex: 'location', key: 'location' },
                    { title: '状态', key: 'status', width: 100 },
                    { title: '温度', key: 'temp', width: 90 },
                    { title: '湿度', key: 'hum', width: 90 },
                    { title: '最后心跳', dataIndex: 'lastSeen', key: 'lastSeen', width: 110 },
                ];

                return {
                    connectForm, connected, connecting, autoRefresh,
                    logs, summary, devices, alerts, columns,
                    pubMessage, lineRef, donutRef,
                    statusColor, statusText, levelColor, levelText,
                    connectMQTT, disconnectMQTT, publishMessage,
                };
            },

            template: `
                <a-layout style="min-height: 100vh;">
                    <!-- 侧边栏 -->
                    <a-layout-sider v-model:collapsed="collapsed" collapsible :trigger="null" width="208">
                        <div class="logo">MQTT IoT</div>
                        <a-menu theme="dark" mode="inline" :default-selected-keys="['overview']">
                            <a-menu-item key="overview">📊 实时概览</a-menu-item>
                            <a-menu-item key="connection">🔗 连接管理</a-menu-item>
                            <a-menu-item key="devices">🔌 设备列表</a-menu-item>
                            <a-menu-item key="alerts">🔔 告警中心</a-menu-item>
                        </a-menu>
                    </a-layout-sider>

                    <a-layout>
                        <!-- 顶栏 -->
                        <a-layout-header class="site-header">
                            <div style="display:flex;align-items:center;gap:12px;">
                                <a-button type="text" @click="collapsed = !collapsed">
                                    <span v-if="collapsed">☰</span><span v-else>✕</span>
                                </a-button>
                                <span style="font-size:16px;font-weight:600;">MQTT 实时监控</span>
                                <span :style="{ fontSize: '12px', color: connected ? '#52c41a' : '#bfbfbf' }">
                                    <span class="live-dot" :class="connected ? 'on' : 'off'"></span>
                                    {{ connected ? '已连接' : (connecting ? '连接中…' : '未连接') }}
                                </span>
                            </div>
                            <div style="display:flex;align-items:center;gap:12px;">
                                <a-button size="small" :type="connected ? 'default' : 'primary'" @click="connectMQTT" :loading="connecting">
                                    {{ connected ? '重新连接' : '连接' }}
                                </a-button>
                                <a-button size="small" danger :disabled="!connected" @click="disconnectMQTT">断开</a-button>
                                <a-avatar style="background-color:#1677ff;">运</a-avatar>
                            </div>
                        </a-layout-header>

                        <a-layout-content>
                            <!-- 连接配置 + 消息日志 -->
                            <a-row :gutter="[16, 16]">
                                <a-col :xs="24" :lg="10">
                                    <a-card :bordered="false" title="MQTT 连接配置">
                                        <a-form layout="vertical" class="conn-form">
                                            <a-form-item label="Broker WebSocket URL">
                                                <a-input v-model:value="connectForm.url" placeholder="ws://broker.emqx.io:8083/mqtt" />
                                            </a-form-item>
                                            <a-row :gutter="12">
                                                <a-col :span="12">
                                                    <a-form-item label="Client ID">
                                                        <a-input v-model:value="connectForm.clientId" />
                                                    </a-form-item>
                                                </a-col>
                                                <a-col :span="12">
                                                    <a-form-item label="订阅 Topic">
                                                        <a-input v-model:value="connectForm.subTopic" />
                                                    </a-form-item>
                                                </a-col>
                                            </a-row>
                                            <a-row :gutter="12">
                                                <a-col :span="12">
                                                    <a-form-item label="Username（可选）">
                                                        <a-input v-model:value="connectForm.username" />
                                                    </a-form-item>
                                                </a-col>
                                                <a-col :span="12">
                                                    <a-form-item label="Password（可选）">
                                                        <a-input-password v-model:value="connectForm.password" />
                                                    </a-form-item>
                                                </a-col>
                                            </a-row>
                                        </a-form>
                                        <a-alert
                                            type="warning"
                                            show-icon
                                            message="broker.emqx.io 是公共测试 Broker，所有消息公开可见，请勿发送敏感数据。"
                                            style="font-size:12px;"
                                        />
                                    </a-card>
                                </a-col>

                                <a-col :xs="24" :lg="14">
                                    <a-card :bordered="false" title="消息日志">
                                        <div class="msg-log">
                                            <div v-for="log in logs" :key="log.key">
                                                <span class="t">[{{ log.time }}]</span>
                                                <span :class="log.type === 'err' ? 'err' : ''">
                                                    {{ log.text }}
                                                </span>
                                            </div>
                                            <div v-if="logs.length === 0" style="color:#808080;">
                                                等待 MQTT 消息…
                                            </div>
                                        </div>
                                    </a-card>
                                </a-col>
                            </a-row>

                            <!-- 概览卡片 -->
                            <a-row :gutter="[16, 16]" style="margin-top:16px;">
                                <a-col :xs="24" :sm="12" :xl="6">
                                    <a-card class="stat-card" :bordered="false">
                                        <div class="stat-label">在线设备</div>
                                        <div class="stat-value" style="color:#52c41a;">{{ summary.online }}</div>
                                    </a-card>
                                </a-col>
                                <a-col :xs="24" :sm="12" :xl="6">
                                    <a-card class="stat-card" :bordered="false">
                                        <div class="stat-label">离线设备</div>
                                        <div class="stat-value" style="color:#ff4d4f;">{{ summary.offline }}</div>
                                    </a-card>
                                </a-col>
                                <a-col :xs="24" :sm="12" :xl="6">
                                    <a-card class="stat-card" :bordered="false">
                                        <div class="stat-label">告警数</div>
                                        <div class="stat-value" style="color:#faad14;">{{ summary.alerts }}</div>
                                    </a-card>
                                </a-col>
                                <a-col :xs="24" :sm="12" :xl="6">
                                    <a-card class="stat-card" :bordered="false">
                                        <div class="stat-label">消息吞吐 (条/秒)</div>
                                        <div class="stat-value" style="color:#1677ff;">{{ summary.throughput }}</div>
                                    </a-card>
                                </a-col>
                            </a-row>

                            <!-- 图表 -->
                            <a-row :gutter="[16, 16]" style="margin-top:16px;">
                                <a-col :xs="24" :lg="16">
                                    <a-card :bordered="false" title="实时环境数据（来自 MQTT）">
                                        <div ref="lineRef" class="chart-box"></div>
                                    </a-card>
                                </a-col>
                                <a-col :xs="24" :lg="8">
                                    <a-card :bordered="false" title="设备在线率">
                                        <div ref="donutRef" class="chart-box"></div>
                                    </a-card>
                                </a-col>
                            </a-row>

                            <!-- 发布消息 + 设备 + 告警 -->
                            <a-row :gutter="[16, 16]" style="margin-top:16px;">
                                <a-col :xs="24" :xl="8">
                                    <a-card :bordered="false" title="发布控制指令">
                                        <a-form layout="vertical">
                                            <a-form-item label="发布 Topic">
                                                <a-input v-model:value="connectForm.pubTopic" />
                                            </a-form-item>
                                            <a-form-item label="Payload">
                                                <a-textarea v-model:value="pubMessage" :rows="3" />
                                            </a-form-item>
                                        </a-form>
                                        <a-button type="primary" block @click="publishMessage" :disabled="!connected">
                                            发布消息
                                        </a-button>
                                    </a-card>
                                </a-col>

                                <a-col :xs="24" :xl="16">
                                    <a-card :bordered="false" title="设备状态（来自 MQTT 消息）">
                                        <a-table
                                            :columns="columns"
                                            :data-source="devices"
                                            :pagination="false"
                                            size="middle"
                                            :scroll="{ x: 760 }"
                                            locale="{ emptyText: '暂无设备数据，等待 MQTT 消息…' }"
                                        >
                                            <template #bodyCell="{ column, record }">
                                                <template v-if="column.key === 'status'">
                                                    <a-tag :color="statusColor(record.status)">{{ statusText(record.status) }}</a-tag>
                                                </template>
                                                <template v-else-if="column.key === 'temp'">
                                                    <span v-if="record.temp !== null">{{ record.temp }} °C</span>
                                                    <span v-else style="color:#bfbfbf;">—</span>
                                                </template>
                                                <template v-else-if="column.key === 'hum'">
                                                    <span v-if="record.hum !== null">{{ record.hum }} %</span>
                                                    <span v-else style="color:#bfbfbf;">—</span>
                                                </template>
                                            </template>
                                        </a-table>
                                    </a-card>
                                </a-col>
                            </a-row>

                            <!-- 告警列表 -->
                            <a-row :gutter="[16, 16]" style="margin-top:16px;">
                                <a-col :span="24">
                                    <a-card :bordered="false" title="实时告警（来自 MQTT 消息）">
                                        <a-list :data-source="alerts" size="small" :locale="{ emptyText: '暂无告警' }">
                                            <template #renderItem="{ item }">
                                                <a-list-item>
                                                    <a-list-item-meta>
                                                        <template #title>
                                                            <a-tag :color="levelColor(item.level)" style="margin-right:6px;">
                                                                {{ levelText(item.level) }}
                                                            </a-tag>
                                                            <span style="font-size:13px;">{{ item.message }}</span>
                                                        </template>
                                                        <template #description>
                                                            <span style="font-size:12px;color:#8c8c8c;">
                                                                {{ item.device }} · {{ item.time }}
                                                            </span>
                                                        </template>
                                                    </a-list-item-meta>
                                                </a-list-item>
                                            </template>
                                        </a-list>
                                    </a-card>
                                </a-col>
                            </a-row>
                        </a-layout-content>
                    </a-layout>
                </a-layout>
            `,

            // 补充 collapsed 状态
            data() {
                return { collapsed: false };
            },
        });

        app.use(antd);
        app.mount('#app');
    </script>
</body>
</html>
