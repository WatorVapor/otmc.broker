<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001529" />
  <title>跟随角色 OTMC Client 密钥与 CSR 生成器</title>

  <!-- antdv-next 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/antd.css" />

  <style>
    html, body { margin: 0; padding: 0; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .logo {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
    }

    .page-header {
      background: #001529;
      color: #fff;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .page-header .collapse-btn {
      color: #fff;
      font-size: 18px;
      padding: 0 8px;
    }
    .page-header .collapse-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .page-content { max-width: 1120px; margin: 0 auto; padding: 24px; }

    .section + .section { margin-top: 16px; }
    .pem-block + .pem-block { margin-top: 20px; }
    .pem-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .pem-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
      font-size: 12px !important;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .secure-box {
      background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px;
      padding: 12px 16px; color: #135200;
    }

    /* ===== 区块主题色系统 ===== */
    .accent-blue   { --accent: #0958d9; --accent-soft: #eef5ff; --accent-edge: #c8ddff; }
    .accent-green  { --accent: #389e0d; --accent-soft: #f4fbe9; --accent-edge: #d3efb4; }
    .accent-cyan   { --accent: #08979c; --accent-soft: #ecfffd; --accent-edge: #b5eee9; }
    .accent-orange { --accent: #d46b08; --accent-soft: #fff8ec; --accent-edge: #ffdca0; }
    .accent-purple { --accent: #722ed1; --accent-soft: #f7f0ff; --accent-edge: #dfccff; }

    .section.ant-card {
      border-radius: 10px;
      border: 1px solid #ebedf0;
      border-top: 3px solid var(--accent, #e8e8e8);
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .03);
    }

    .section.ant-card .ant-card-head {
      border-bottom: 1px solid var(--accent-edge, #f0f0f0) !important;
      background: linear-gradient(90deg, var(--accent-soft, #fafafa), #ffffff 70%);
      min-height: 52px;
      padding: 0 20px;
    }

    .section.ant-card .ant-card-head-title {
      position: relative;
      padding-left: 14px !important;
      font-size: 15px;
      font-weight: 600;
      color: rgba(0, 0, 0, .88);
    }

    .section.ant-card .ant-card-head-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--accent, #d9d9d9);
    }

    /* ===== 终端证书类型说明提示框 ===== */
    .type-hint {
      margin: 0 0 16px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.65;
      color: #0958d9;
      background: #f4f9ff;
      border: 1px solid #c8ddff;
      border-left: 3px solid #0958d9;
      border-radius: 0 8px 8px 0;
    }
    .type-hint b { color: #003eb3; }

    .type-hint.hint-purple {
      color: #531dab;
      background: #f7f0ff;
      border-color: #dfccff;
      border-left-color: #722ed1;
    }
    .type-hint.hint-purple b { color: #391085; }

    /* ===== 生成 / 存储 提示微调 ===== */
    .gen-warn {
      margin: 12px 0 0;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.65;
      color: #ad4e00;
      background: #fff8ec;
      border: 1px solid #ffdca0;
      border-left: 3px solid #d46b08;
      border-radius: 0 8px 8px 0;
    }

    .cert-card {
      padding: 12px 14px;
      border: 1px solid #dfccff;
      border-radius: 8px;
      background: #fcfaff;
      height: 100%;
    }
    .cert-card.is-empty { opacity: .55; }

    @media (max-width: 768px) {
      .page-header {
        height: 56px; padding: 0 8px; font-size: 15px; gap: 4px; line-height: normal;
      }
      .page-header .collapse-btn { font-size: 18px; padding: 0 6px; }
      .page-content { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
      .section + .section { margin-top: 12px; }
      .pem-text { font-size: 11px !important; }
      .ant-btn { min-height: 36px; }
      .ant-alert { padding: 10px 12px; }

      .section.ant-card .ant-card-head { padding: 0 14px; min-height: 46px; }
      .section.ant-card .ant-card-head-title { font-size: 14px; padding-left: 12px !important; }
      .type-hint { padding: 9px 12px; }
    }

    @media (max-width: 480px) {
      .page-header { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script type="text/x-template" id="app-template">
  <a-layout style="min-height: 100vh">

    <!-- 桌面端左侧菜单 -->
    <a-layout-sider
      v-if="!isMobile"
      v-model:collapsed="collapsed"
      collapsible
      :trigger="null"
      :width="208"
      theme="dark"
    >
      <div class="logo">{{ collapsed ? '导航' : 'OTMC 导航' }}</div>

      <a-menu theme="dark" mode="inline" :selected-keys="selectedKeys">
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-layout-sider>

    <!-- 移动端抽屉导航 -->
    <a-drawer
      v-if="isMobile"
      v-model:open="drawerOpen"
      placement="left"
      :width="230"
      :closable="false"
      :styles="{ body: { padding: 0, background: '#001529' } }"
    >
      <div class="logo">OTMC 导航</div>
      <a-menu
        theme="dark"
        mode="inline"
        :selected-keys="selectedKeys"
        @click="drawerOpen = false"
      >
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-drawer>

    <!-- 右侧主体 -->
    <a-layout>
      <a-layout-header class="page-header">
        <a-button type="text" class="collapse-btn" @click="toggleMenu">☰</a-button>
        <span>跟随角色 OTMC Client 密钥与 CSR 生成器</span>
      </a-layout-header>

      <a-layout-content>
        <div class="page-content">

          <a-alert
            v-if="!cryptoOk" type="error" show-icon style="margin-bottom: 16px"
            message="当前环境不支持 Web Crypto API（需要使用 HTTPS 或 localhost 访问）"
          ></a-alert>
          <a-alert
            v-if="!indexedDbOk" type="error" show-icon style="margin-bottom: 16px"
            :message="dbError || '当前环境不支持 IndexedDB，无法安全存储密钥'"
          ></a-alert>

          <!-- ① 终端证书与 Subject -->
          <a-card class="section accent-blue" title="① 终端证书与 Subject (DN)">
            <div class="type-hint">
              跟随者只需生成终端密钥对并提交 CSR，由所在 Space 的领头者或签发 CA 完成证书签发。
              本页面生成的证书类型固定为 <b>Client Leaf</b>，用于 MQTT mTLS 客户端身份。
            </div>

            <a-form layout="vertical">
              <a-row :gutter="16">
                <a-col :xs="24" :sm="12" :md="8" v-for="f in subjectFields" :key="f.key">
                  <a-form-item :label="f.label">
                    <a-input v-model:value="form[f.key]" :placeholder="f.placeholder" allow-clear />
                  </a-form-item>
                </a-col>
              </a-row>
            </a-form>

            <a-descriptions :column="1" size="small" bordered>
              <a-descriptions-item label="Subject 字符串">
                <span class="mono">{{ subjectString || '(空)' }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="密钥算法">
                ECDSA P-384（secp384r1）· 签名摘要 SHA-384 · 私钥不可导出
              </a-descriptions-item>
              <a-descriptions-item label="证书用途">
                <a-tag color="blue">End-Entity · clientAuth</a-tag>
              </a-descriptions-item>
              <a-descriptions-item label="等价 openssl">
                <span class="mono">
                  openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp384r1 -out client-space-leaf.key
                </span>
              </a-descriptions-item>
            </a-descriptions>
          </a-card>

          <!-- ② 生成 -->
          <a-card class="section accent-green" title="② 生成 / 存储">
            <a-space wrap>
              <a-button type="primary" :loading="loading" :disabled="!cryptoOk || !indexedDbOk" @click="onGenerate">
                生成密钥对与 CSR
              </a-button>
              <a-button :loading="loading" :disabled="!hasStored || !indexedDbOk" @click="onLoad">
                从 IndexedDB 加载
              </a-button>
              <a-button danger :disabled="(!hasStored && !hasResult) || !indexedDbOk" @click="onClear">
                清除 IndexedDB 中的密钥
              </a-button>
            </a-space>

            <div class="gen-warn">
              ⚠️ 私钥始终以<b>不可导出</b>模式生成并存入 IndexedDB，无法被浏览器导出为 .key 文件。
              重新生成会<b>覆盖</b>当前证书类型已有的密钥，旧密钥将永久丢失，且无法恢复。
            </div>
          </a-card>

          <!-- ③ 结果 -->
          <a-card v-if="hasResult" class="section accent-cyan" title="③ 结果">
            <a-descriptions :column="2" size="small" bordered style="margin-bottom: 16px">
              <a-descriptions-item label="证书类型">Client Leaf</a-descriptions-item>
              <a-descriptions-item label="生成时间">{{ result.createdAt }}</a-descriptions-item>
              <a-descriptions-item label="IndexedDB Record" :span="2">
                <span class="mono">{{ dbName }} / client-space-leaf</span>
              </a-descriptions-item>
              <a-descriptions-item label="Subject" :span="2">
                <span class="mono">{{ result.subject }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="私钥类型" :span="2">
                <a-tag color="green">不可导出（extractable=false）</a-tag>
              </a-descriptions-item>
            </a-descriptions>

            <div class="pem-block">
              <div class="pem-head">
                <span><a-typography-text strong>私钥</a-typography-text>
                  <a-tag color="green" style="margin-left: 8px">不可导出</a-tag>
                </span>
              </div>
              <div class="secure-box">
                🔒 私钥为不可导出 CryptoKey，已安全存储在 IndexedDB 中。
                浏览器拒绝任何 <span class="mono">exportKey()</span> 读取私钥明文的请求；
                页面仅保留 <span class="mono">sign()</span> 签名能力。无法下载 .key 文件。
              </div>
            </div>

            <div class="pem-block" v-if="result.publicKeyPem">
              <div class="pem-head">
                <span><a-typography-text strong>公钥 (SPKI)</a-typography-text>
                  <a-tag color="blue" style="margin-left: 8px">client-space-leaf.pub</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(result.publicKeyPem)">复制</a-button>
                  <a-button size="small" @click="downloadFile('client-space-leaf.pub', result.publicKeyPem)">下载</a-button>
                </a-space>
              </div>
              <a-textarea :rows="6" :value="result.publicKeyPem" readonly class="pem-text" />
            </div>

            <div class="pem-block" v-if="result.csrPem">
              <div class="pem-head">
                <span><a-typography-text strong>CSR (PKCS#10 · SHA-384)</a-typography-text>
                  <a-tag color="blue" style="margin-left: 8px">client-space-leaf.csr</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(result.csrPem)">复制</a-button>
                  <a-button size="small" @click="downloadFile('client-space-leaf.csr', result.csrPem)">下载</a-button>
                </a-space>
              </div>
              <a-textarea :rows="7" :value="result.csrPem" readonly class="pem-text" />
            </div>

            <a-divider />

            <a-collapse ghost>
              <a-collapse-panel key="1" header="对应的 CA 签发命令（由 Space 2nd-Level CA 签发）">
                <a-typography-paragraph type="secondary" style="margin: 0 0 8px">
                  前置条件：CSR 与扩展文件保存在同一目录，签发 CA 的证书与私钥也在同一目录：
                  <span class="mono">client-space-inter.crt</span> /
                  <span class="mono">client-space-inter.key</span>
                </a-typography-paragraph>

                <a-typography-paragraph style="margin: 0 0 4px">
                  扩展文件 <span class="mono">client-space-leaf.ext</span>：
                </a-typography-paragraph>
                <pre class="mono" style="margin: 0 0 12px; white-space: pre-wrap">[ v3_req ]
basicConstraints = CA:FALSE
keyUsage = critical, digitalSignature
extendedKeyUsage = clientAuth
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer</pre>

                <a-typography-paragraph style="margin: 0 0 4px">签发命令：</a-typography-paragraph>
                <pre class="mono" style="margin:0; white-space:pre-wrap">openssl x509 -req \
  -in client-space-leaf.csr \
  -CA client-space-inter.crt \
  -CAkey client-space-inter.key \
  -CAcreateserial \
  -sha384 \
  -days 36500 \
  -out client-space-leaf.crt \
  -extfile client-space-leaf.ext \
  -extensions v3_req</pre>
              </a-collapse-panel>
            </a-collapse>

            <a-typography-paragraph type="secondary" style="margin: 12px 0 0">
              注意 1：CSR 本身不携带证书扩展。签发时请使用上方展示的 <span class="mono">client-space-leaf.ext</span>
              （basicConstraints=CA:FALSE、keyUsage=critical,digitalSignature、extendedKeyUsage=clientAuth），与 bash 脚本保持一致。
            </a-typography-paragraph>
            <a-typography-paragraph type="secondary" style="margin: 0">
              注意 2：从 IndexedDB 加载时会用私钥<b>重新签名</b>生成新的 CSR（ECDSA 签名具有随机性），
              Subject 与公钥保持不变，新旧 CSR 均可被 CA 签发为等效证书。
            </a-typography-paragraph>
          </a-card>

          <!-- ④ 导入其他设备签发的证书（叶子 + 上级 CA，整体粘贴） -->
          <a-card class="section accent-purple" title="④ 导入其他设备签发的证书（叶子 + 上级 CA，整体粘贴）">
            <div class="type-hint hint-purple">
              由领头者页面为本设备 CSR 签发的 <b>Client Leaf 叶子证书</b>，以及对应的
              <b>Space 2nd-Level CA</b> 和 <b>Space 1st-Level CA</b> 证书，
              可一次性整体粘贴到下方输入框（PEM 格式，三张证书首尾相接即可，顺序不限），
              系统会自动识别各自角色并保存到 IndexedDB。
              本页面<b>只保存公钥证书，不保存任何私钥</b>。
            </div>

            <a-form layout="vertical">
              <a-form-item label="证书链 PEM（三张证书可一次粘贴，顺序任意）">
                <a-textarea
                  v-model:value="importForm.chainPem"
                  :rows="16"
                  class="pem-text"
                  placeholder="-----BEGIN CERTIFICATE-----&#10;... 叶子证书 ...&#10;-----END CERTIFICATE-----&#10;-----BEGIN CERTIFICATE-----&#10;... 2 级 CA ...&#10;-----END CERTIFICATE-----&#10;-----BEGIN CERTIFICATE-----&#10;... 1 级 CA ...&#10;-----END CERTIFICATE-----"
                />
              </a-form-item>
            </a-form>

            <a-alert
              v-if="importErrors.chain"
              type="error"
              show-icon
              :message="importErrors.chain"
              style="margin-bottom: 12px"
            ></a-alert>

            <a-space wrap style="margin-bottom: 12px">
              <a-button type="primary" :loading="importLoading" @click="onParseChain">解析证书链</a-button>
              <a-button
                type="primary"
                ghost
                :loading="importSaving"
                :disabled="!importInfo.leaf || !importInfo.top || !importInfo.inter"
                @click="onSaveAll"
              >
                保存全部到 IndexedDB
              </a-button>
              <a-button :loading="importLoading" @click="loadImportedFromDb(false)">从 IndexedDB 加载</a-button>
              <a-button danger :disabled="!importedLeafRecord && !importedTopRecord && !importedInterRecord" @click="onClearImportedFromDb">
                清除 IndexedDB 中的导入证书
              </a-button>
            </a-space>

            <!-- 链关系校验 -->
            <div v-if="leafIssuerMatchesInter !== null || interIssuerMatchesTop !== null" style="margin-bottom: 12px">
              <a-alert
                v-if="leafIssuerMatchesInter === true"
                type="success" show-icon
                message="叶子证书 → 2 级 CA：叶子证书的 Issuer 与 Space 2nd-Level CA 的 Subject 一致。"
                style="margin-bottom: 8px"
              />
              <a-alert
                v-else-if="leafIssuerMatchesInter === false"
                type="warning" show-icon
                message="叶子证书 → 2 级 CA：叶子证书的 Issuer 与 Space 2nd-Level CA 的 Subject 不一致，请确认证书链。"
                style="margin-bottom: 8px"
              />
              <a-alert
                v-if="interIssuerMatchesTop === true"
                type="success" show-icon
                message="2 级 CA → 1 级 CA：Space 2nd-Level CA 的 Issuer 与 Space 1st-Level CA 的 Subject 一致。"
                style="margin-bottom: 8px"
              />
              <a-alert
                v-else-if="interIssuerMatchesTop === false"
                type="warning" show-icon
                message="2 级 CA → 1 级 CA：Space 2nd-Level CA 的 Issuer 与 Space 1st-Level CA 的 Subject 不一致，请确认证书链。"
                style="margin-bottom: 8px"
              />
            </div>

            <!-- 三张证书的解析结果并排 -->
            <a-row :gutter="16">
              <a-col :xs="24" :md="8">
                <div class="cert-card" :class="{ 'is-empty': !importInfo.leaf }">
                  <div class="pem-head">
                    <span>
                      <a-typography-text strong>叶子证书 (Client Leaf)</a-typography-text>
                      <a-tag v-if="importInfo.leaf" color="blue" style="margin-left: 8px">CA:FALSE</a-tag>
                    </span>
                  </div>
                  <template v-if="importInfo.leaf">
                    <a-descriptions :column="1" size="small" bordered>
                      <a-descriptions-item label="Subject"><span class="mono">{{ importInfo.leaf.subject }}</span></a-descriptions-item>
                      <a-descriptions-item label="Issuer"><span class="mono">{{ importInfo.leaf.issuer }}</span></a-descriptions-item>
                      <a-descriptions-item label="Serial"><span class="mono">{{ importInfo.leaf.serial }}</span></a-descriptions-item>
                      <a-descriptions-item label="有效期"><span class="mono">{{ importInfo.leaf.notBefore }} → {{ importInfo.leaf.notAfter }}</span></a-descriptions-item>
                    </a-descriptions>
                  </template>
                  <a-typography-text v-else type="secondary">未识别到叶子证书</a-typography-text>
                </div>
              </a-col>

              <a-col :xs="24" :md="8">
                <div class="cert-card" :class="{ 'is-empty': !importInfo.inter }">
                  <div class="pem-head">
                    <span>
                      <a-typography-text strong>Space 2nd-Level CA</a-typography-text>
                      <a-tag v-if="importInfo.inter" color="orange" style="margin-left: 8px">CA:TRUE · pathlen:0</a-tag>
                    </span>
                  </div>
                  <template v-if="importInfo.inter">
                    <a-descriptions :column="1" size="small" bordered>
                      <a-descriptions-item label="Subject"><span class="mono">{{ importInfo.inter.subject }}</span></a-descriptions-item>
                      <a-descriptions-item label="Issuer"><span class="mono">{{ importInfo.inter.issuer }}</span></a-descriptions-item>
                      <a-descriptions-item label="Serial"><span class="mono">{{ importInfo.inter.serial }}</span></a-descriptions-item>
                      <a-descriptions-item label="有效期"><span class="mono">{{ importInfo.inter.notBefore }} → {{ importInfo.inter.notAfter }}</span></a-descriptions-item>
                    </a-descriptions>
                  </template>
                  <a-typography-text v-else type="secondary">未识别到 2 级 CA</a-typography-text>
                </div>
              </a-col>

              <a-col :xs="24" :md="8">
                <div class="cert-card" :class="{ 'is-empty': !importInfo.top }">
                  <div class="pem-head">
                    <span>
                      <a-typography-text strong>Space 1st-Level CA</a-typography-text>

<script>
const { createApp, reactive, ref, computed, onMounted, onBeforeUnmount } = Vue;

const message = (antd && antd.message) || {
  success: (m) => console.log('[success]', m),
  error: (m) => console.error('[error]', m),
  warning: (m) => console.warn('[warning]', m),
  info: (m) => console.info('[info]', m),
};

const textEncoder = new TextEncoder();

function concatBytes(...chunks) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function derLength(len) {
  if (len < 0x80) return new Uint8Array([len]);
  const tmp = [];
  let n = len;
  while (n > 0) { tmp.unshift(n & 0xff); n = Math.floor(n / 256); }
  return new Uint8Array([0x80 | tmp.length, ...tmp]);
}

function tlv(tag, content) {
  return concatBytes(new Uint8Array([tag]), derLength(content.length), content);
}

const derSequence = (...items) => tlv(0x30, concatBytes(...items));
const derSet = (...items) => tlv(0x31, concatBytes(...items));

function derInteger(bytes) {
  let i = 0;
  while (i < bytes.length - 1 && bytes[i] === 0) i++;
  let v = bytes.subarray(i);
  if (v[0] & 0x80) v = concatBytes(new Uint8Array([0x00]), v);
  return tlv(0x02, v);
}

function derOid(oidStr) {
  const parts = oidStr.split('.').map(Number);
  const bytes = [40 * parts[0] + parts[1]];
  for (let i = 2; i < parts.length; i++) {
    let n = parts[i];
    const buf = [n & 0x7f];
    n = Math.floor(n / 128);
    while (n > 0) { buf.unshift((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    bytes.push(...buf);
  }
  return tlv(0x06, new Uint8Array(bytes));
}

const derUtf8 = (s) => tlv(0x0c, textEncoder.encode(s));
const derBitString = (bytes) => tlv(0x03, concatBytes(new Uint8Array([0x00]), bytes));

function ecdsaRawToDer(raw) {
  const half = raw.length / 2;
  return derSequence(
    derInteger(raw.subarray(0, half)),
    derInteger(raw.subarray(half, half * 2))
  );
}

function pemFromDer(der, label) {
  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < der.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, der.subarray(i, i + CHUNK));
  }
  const b64 = btoa(binary);
  const lines = (b64.match(/.{1,64}/g) || []).join('\n');
  return `-----BEGIN ${label}-----\n${lines}\n-----END ${label}-----`;
}

function toUint8Array(x) {
  if (x instanceof Uint8Array) return x;
  if (x instanceof ArrayBuffer) return new Uint8Array(x);
  if (ArrayBuffer.isView(x)) return new Uint8Array(x.buffer, x.byteOffset, x.byteLength);
  return new Uint8Array(x);
}

const ATTR_OIDS = {
  C: '2.5.4.6', ST: '2.5.4.8', L: '2.5.4.7',
  O: '2.5.4.10', OU: '2.5.4.11', CN: '2.5.4.3',
};
const OID_ECDSA_WITH_SHA384 = '1.2.840.10045.4.3.3';

async function buildCsrPem(subjectAttrs, publicKeySpki, privateKey) {
  const spki = toUint8Array(publicKeySpki);
  const rdnSeq = subjectAttrs
    .filter((a) => a.value)
    .map((a) => {
      const oid = ATTR_OIDS[a.key];
      if (!oid) throw new Error('不支持的 Subject 属性: ' + a.key);
      return derSet(derSequence(derOid(oid), derUtf8(a.value)));
    });
  const subject = derSequence(...rdnSeq);
  const cri = derSequence(
    derInteger(new Uint8Array([0x00])),
    subject,
    spki,
    tlv(0xa0, new Uint8Array(0))
  );
  const rawSig = new Uint8Array(
    await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-384' }, privateKey, cri)
  );
  const sigDer = ecdsaRawToDer(rawSig);
  const csrDer = derSequence(
    cri,
    derSequence(derOid(OID_ECDSA_WITH_SHA384)),
    derBitString(sigDer)
  );
  return pemFromDer(csrDer, 'CERTIFICATE REQUEST');
}

/* ===========================================================================
 * 极简 X.509 / DER 解析
 * ========================================================================= */

function readTLV(buf, offset) {
  const start = offset;
  const tag = buf[offset++];
  let len = buf[offset++];
  if (len & 0x80) {
    const n = len & 0x7f;
    len = 0;
    for (let i = 0; i < n; i++) len = (len << 8) | buf[offset++];
  }
  const valueStart = offset;
  const valueEnd = offset + len;
  return { tag, len, valueStart, valueEnd, rawStart: start, rawEnd: valueEnd };
}

function decodeDerString(tag, bytes) {
  if (tag === 0x1e) {
    let s = '';
    for (let i = 0; i + 1 < bytes.length; i += 2) {
      s += String.fromCharCode((bytes[i] << 8) | bytes[i + 1]);
    }
    return s;
  }
  return new TextDecoder().decode(bytes);
}

function decodeOid(buf, tlv) {
  const bytes = buf.subarray(tlv.valueStart, tlv.valueEnd);
  const parts = [];
  let v = 0;
  for (let i = 0; i < bytes.length; i++) {
    v = (v << 7) | (bytes[i] & 0x7f);
    if (!(bytes[i] & 0x80)) { parts.push(v); v = 0; }
  }
  if (parts.length) {
    const first = parts[0];
    const a = first < 40 ? 0 : first < 80 ? 1 : 2;
    parts[0] = a;
    parts.splice(1, 0, first - a * 40);
  }
  return parts.join('.');
}

const OID_SHORT = {
  '2.5.4.3': 'CN', '2.5.4.6': 'C', '2.5.4.7': 'L',
  '2.5.4.8': 'ST', '2.5.4.10': 'O', '2.5.4.11': 'OU',
  '2.5.4.5': 'serialNumber', '1.2.840.113549.1.9.1': 'emailAddress',
};

function parseNameAttrs(buf, tlv) {
  const attrs = [];
  let off = tlv.valueStart;
  while (off < tlv.valueEnd) {
    const rdn = readTLV(buf, off);
    let aoff = rdn.valueStart;
    while (aoff < rdn.valueEnd) {
      const atv = readTLV(buf, aoff);
      const oidTlv = readTLV(buf, atv.valueStart);
      const valTlv = readTLV(buf, oidTlv.rawEnd);
      attrs.push({
        oid: decodeOid(buf, oidTlv),
        value: decodeDerString(valTlv.tag, buf.subarray(valTlv.valueStart, valTlv.valueEnd)),
      });
      aoff = atv.rawEnd;
    }
    off = rdn.rawEnd;
  }
  return attrs;
}

function formatNameAttrs(attrs) {
  return attrs
    .map((a) => `${OID_SHORT[a.oid] || a.oid}=${a.value}`)
    .join(', ');
}

function parseDerTime(tag, str) {
  let yyyy, mm, dd, hh, mi, ss;
  if (tag === 0x17) {
    const yy = parseInt(str.slice(0, 2), 10);
    yyyy = String(yy >= 50 ? 1900 + yy : 2000 + yy);
    mm = str.slice(2, 4); dd = str.slice(4, 6);
    hh = str.slice(6, 8); mi = str.slice(8, 10); ss = str.slice(10, 12);
  } else if (tag === 0x18) {
    yyyy = str.slice(0, 4); mm = str.slice(4, 6); dd = str.slice(6, 8);
    hh = str.slice(8, 10); mi = str.slice(10, 12); ss = str.slice(12, 14);
  } else {
    return str;
  }
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss} UTC`;
}

function parseX509Pem(pem) {
  const b64 = String(pem).replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
  if (!b64) throw new Error('证书 PEM 内容为空');
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

  const cert = readTLV(buf, 0);
  if (cert.tag !== 0x30) throw new Error('证书结构异常：缺少外层 SEQUENCE');
  const tbs  = readTLV(buf, cert.valueStart);
  if (tbs.tag !== 0x30) throw new Error('证书结构异常：缺少 TBSCertificate');

  let off = tbs.valueStart;
  if (buf[off] === 0xa0) off = readTLV(buf, off).rawEnd;

  const serialTlv = readTLV(buf, off);
  const serialBytes = buf.subarray(serialTlv.valueStart, serialTlv.valueEnd);
  const serial = Array.from(serialBytes, (b) => b.toString(16).padStart(2, '0'))
    .join(':').toUpperCase();
  off = serialTlv.rawEnd;

  off = readTLV(buf, off).rawEnd;

  const issuerTlv = readTLV(buf, off);
  const issuerAttrs = parseNameAttrs(buf, issuerTlv);
  const issuerRaw = buf.slice(issuerTlv.rawStart, issuerTlv.rawEnd);
  off = issuerTlv.rawEnd;

  const validityTlv = readTLV(buf, off);
  const nbTlv = readTLV(buf, validityTlv.valueStart);
  const naTlv = readTLV(buf, nbTlv.rawEnd);
  const notBefore = parseDerTime(nbTlv.tag,
    new TextDecoder().decode(buf.subarray(nbTlv.valueStart, nbTlv.valueEnd)));
  const notAfter  = parseDerTime(naTlv.tag,
    new TextDecoder().decode(buf.subarray(naTlv.valueStart, naTlv.valueEnd)));
  off = validityTlv.rawEnd;

  const subjectTlv = readTLV(buf, off);
  const subjectAttrs = parseNameAttrs(buf, subjectTlv);
  const subjectRaw = buf.slice(subjectTlv.rawStart, subjectTlv.rawEnd);
  off = subjectTlv.rawEnd;

  const spkiTlv = readTLV(buf, off);
  off = spkiTlv.rawEnd;

  let isCa = false;
  let pathLen = null;
  let hasBasicConstraints = false;
  let basicConstraintsCritical = false;

  while (off < tbs.valueEnd) {
    const f = readTLV(buf, off);
    if (f.tag === 0xa3) {
      const extsSeq = readTLV(buf, f.valueStart);
      let eoff = extsSeq.valueStart;
      while (eoff < extsSeq.valueEnd) {
        const ext = readTLV(buf, eoff);
        const eidTlv = readTLV(buf, ext.valueStart);
        const eid = decodeOid(buf, eidTlv);
        let v = eidTlv.rawEnd;
        let critical = false;
        if (v < ext.valueEnd && buf[v] === 0x01) {
          const bTlv = readTLV(buf, v);
          critical = buf[bTlv.valueStart] !== 0;
          v = bTlv.rawEnd;
        }
        const valTlv = readTLV(buf, v);
        const valueBytes = buf.subarray(valTlv.valueStart, valTlv.valueEnd);

        if (eid === '2.5.29.19') {
          hasBasicConstraints = true;
          basicConstraintsCritical = critical;
          const bc = readTLV(valueBytes, 0);
          let boff = bc.valueStart;
          if (boff < bc.valueEnd && valueBytes[boff] === 0x01) {
            const bTlv = readTLV(valueBytes, boff);
            isCa = valueBytes[bTlv.valueStart] !== 0;
            boff = bTlv.rawEnd;
          }
          if (boff < bc.valueEnd && valueBytes[boff] === 0x02) {
            const iTlv = readTLV(valueBytes, boff);
            pathLen = 0;
            for (let i = iTlv.valueStart; i < iTlv.valueEnd; i++) {
              pathLen = (pathLen << 8) | valueBytes[i];
            }
          }
        }
        eoff = ext.rawEnd;
      }
      break;
    }
    off = f.rawEnd;
  }

  return {
    serial,
    issuer:  formatNameAttrs(issuerAttrs),
    subject: formatNameAttrs(subjectAttrs),
    notBefore,
    notAfter,
    issuerRaw,
    subjectRaw,
    isCa,
    pathLen,
    hasBasicConstraints,
    basicConstraintsCritical,
  };
}

/* ============================================================
 *  IndexedDB 层
 * ============================================================ */
const DB_NAME = 'omtc-mtls-keystore';
const DB_VERSION = 2;

const STORE_NAMES = [
  'browser_follower_cert_and_keys',
];

const STORE_NAME = 'browser_follower_cert_and_keys';

let dbPromise = null;

function ensureAllStores(db) {
  STORE_NAMES.forEach((name) => {
    if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
  });
}

function hasAllStores(db) {
  return STORE_NAMES.every((n) => db.objectStoreNames.contains(n));
}

function openRaw(name, version) {
  return new Promise((resolve, reject) => {
    let req;
    try {
      req = (version == null) ? indexedDB.open(name) : indexedDB.open(name, version);
    } catch (e) {
      return reject(e);
    }

    req.onupgradeneeded = () => ensureAllStores(req.result);

    req.onblocked = () => {
      const err = new Error('IndexedDB 升级被其他标签页阻塞，请关闭本站其他标签页后刷新重试');
      err.name = 'BlockedError';
      reject(err);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    req.onsuccess = () => resolve(req.result);
  });
}

async function openWithRepair() {
  let db;

  try {
    db = await openRaw(DB_NAME, DB_VERSION);
  } catch (e) {
    if (e && e.name === 'VersionError') {
      db = await openRaw(DB_NAME);
    } else {
      throw e;
    }
  }

  if (hasAllStores(db)) return db;

  const nextVersion = db.version + 1;
  db.close();

  const db2 = await openRaw(DB_NAME, nextVersion);

  if (!hasAllStores(db2)) {
    db2.close();
    throw new Error('IndexedDB 补建 object store 失败');
  }
  return db2;
}

function openDB() {
  if (dbPromise) return dbPromise;

  dbPromise = openWithRepair().then((db) => {
    db.onversionchange = () => { db.close(); dbPromise = null; };
    return db;
  });

  dbPromise.catch(() => { dbPromise = null; });
  return dbPromise;
}

async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('写入事务被中止'));
  });
}

async function dbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('删除事务被中止'));
  });
}

/* ============================================================
 * PEM 证书链拆分 + 自动识别
 * ============================================================ */
const PEM_CERT_RE = /-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/g;

function splitPemCertificates(text) {
  const s = String(text || '');
  const matches = s.match(PEM_CERT_RE) || [];
  return matches.map((m) => m.trim());
}

function derBytesEqual(a, b) {
  if (!a || !b) return false;
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/**
 * 从若干已解析的证书中识别 leaf / inter / top。
 * 优先用 basicConstraints（isCa、pathLen），辅以 Issuer/Subject 链关系。
 */
function classifyCertificates(parsed) {
  if (!parsed || parsed.length === 0) return { leaf: null, inter: null, top: null };

  let leaf = null;
  let inter = null;
  let top = null;

  // 1) 明确叶子：!isCa
  const leaves = parsed.filter((c) => !c.info.isCa);
  if (leaves.length >= 1) leaf = leaves[0];

  // 2) 明确 CA
  const cas = parsed.filter((c) => c.info.isCa);

  if (cas.length >= 2) {
    // 优先按 Issuer/Subject 链关系判断
    // 下级 CA 的 Issuer == 上级 CA 的 Subject
    const findIssuerOf = (target) =>
      cas.find((c) => c !== target && derBytesEqual(target.info.issuerRaw, c.info.subjectRaw));

    // 找出 Issuer 被别人 Subject 匹配的那张为下级
    // 找出 Subject 是别人 Issuer 的那张为上级
    const pairs = [];
    for (const a of cas) {
      for (const b of cas) {
        if (a === b) continue;
        if (derBytesEqual(a.info.issuerRaw, b.info.subjectRaw)) {
          pairs.push({ child: a, parent: b });
        }
      }
    }

    if (pairs.length >= 1) {
      inter = pairs[0].child;
      top = pairs[0].parent;
    } else {
      // 兜底：按 pathLen 升序
      const sorted = [...cas].sort((x, y) => {
        const xp = x.info.pathLen == null ? 99 : x.info.pathLen;
        const yp = y.info.pathLen == null ? 99 : y.info.pathLen;
        return xp - yp;
      });
      inter = sorted[0];
      top = sorted[1];
    }
  } else if (cas.length === 1) {
    // 只有一张 CA：根据 pathLen 决定
    if (cas[0].info.pathLen === 0) inter = cas[0];
    else top = cas[0];
  }

  return { leaf, inter, top };
}

const app = createApp({
  template: '#app-template',
  setup() {
    const mqMobile = window.matchMedia('(max-width: 768px)');
    const isMobile = ref(mqMobile.matches);

    const collapsed = ref(false);
    const drawerOpen = ref(false);
    const selectedKeys = ref(['setup']);

    const toggleMenu = () => {
      if (isMobile.value) {
        drawerOpen.value = !drawerOpen.value;
      } else {
        collapsed.value = !collapsed.value;
      }
    };

    const onMediaChange = (e) => {
      isMobile.value = e.matches;
      if (!e.matches) drawerOpen.value = false;
    };

    onMounted(() => {
      if (mqMobile.addEventListener) {
        mqMobile.addEventListener('change', onMediaChange);
      } else if (mqMobile.addListener) {
        mqMobile.addListener(onMediaChange);
      }
    });

    onBeforeUnmount(() => {
      if (mqMobile.removeEventListener) {
        mqMobile.removeEventListener('change', onMediaChange);
      } else if (mqMobile.removeListener) {
        mqMobile.removeListener(onMediaChange);
      }
    });

    const subjectFields = [
      { key: 'C',  label: 'C (Country)',          placeholder: 'JP' },
      { key: 'ST', label: 'ST (State / Province)', placeholder: 'Tokyo' },
      { key: 'L',  label: 'L (Locality)',          placeholder: '(可选)' },
      { key: 'O',  label: 'O (Organization)',      placeholder: 'Client' },
      { key: 'OU', label: 'OU (Org Unit)',         placeholder: '(可选)' },
      { key: 'CN', label: 'CN (Common Name)',      placeholder: '' },
    ];

    const form = reactive({
      C: 'JP', ST: 'Tokyo', L: '', O: 'Client', OU: '',
      CN: 'OTMC-Client_Leaf_4_Space_3rd_level_Cert',
    });

    const result = reactive({
      csrPem: '',
      publicKeyPem: '',
      subject: '',
      createdAt: '',
    });

    const loading = ref(false);
    const hasStored = ref(false);
    const cryptoOk = ref(true);
    const indexedDbOk = ref(true);
    const dbError = ref('');

    const hasResult = computed(() => !!(result.csrPem || result.publicKeyPem));

    const subjectString = computed(() =>
      subjectFields
        .filter((f) => form[f.key])
        .map((f) => `/${f.key}=${form[f.key]}`)
        .join('')
    );

    const RECORD_KEY = 'client-space-leaf';

    /* ===== 导入外部签发的证书链（叶子 + 上级 CA，整体粘贴） ===== */
    const IMPORT_KEYS = {
      top: 'client-space-top',
      inter: 'client-space-inter',
    };

    const importForm = reactive({ chainPem: '' });
    const importInfo = reactive({ leaf: null, inter: null, top: null });
    const importErrors = reactive({ chain: '' });
    const importLoading = ref(false);
    const importSaving = ref(false);
    const importedTopRecord = ref(null);
    const importedInterRecord = ref(null);
    const importedLeafRecord = ref(null);

    const leafIssuerMatchesInter = computed(() => {
      const l = importInfo.leaf;
      const i = importInfo.inter;
      if (!l || !i || !l.issuerRaw || !i.subjectRaw) return null;
      return derBytesEqual(l.issuerRaw, i.subjectRaw);
    });

    const interIssuerMatchesTop = computed(() => {
      const i = importInfo.inter;
      const t = importInfo.top;
      if (!i || !t || !i.issuerRaw || !t.subjectRaw) return null;
      return derBytesEqual(i.issuerRaw, t.subjectRaw);
    });

    function parseChainInternal(silent) {
      importErrors.chain = '';
      importInfo.leaf = null;
      importInfo.inter = null;
      importInfo.top = null;

      const text = (importForm.chainPem || '').trim();
      if (!text) {
        if (!silent) importErrors.chain = '请粘贴证书链 PEM';
        return false;
      }

      const pems = splitPemCertificates(text);
      if (pems.length === 0) {
        if (!silent) importErrors.chain = '未找到任何 PEM 证书块（需要 -----BEGIN CERTIFICATE----- 标记）';
        return false;
      }

      const parsed = [];
      for (let i = 0; i < pems.length; i++) {
        try {
          const info = parseX509Pem(pems[i]);
          parsed.push({ pem: pems[i], info });
        } catch (e) {
          if (!silent) importErrors.chain = `第 ${i + 1} 张证书解析失败：${e && e.message ? e.message : e}`;
          return false;
        }
      }

      const cls = classifyCertificates(parsed);
      importInfo.leaf = cls.leaf ? { pem: cls.leaf.pem, ...cls.leaf.info } : null;
      importInfo.inter = cls.inter ? { pem: cls.inter.pem, ...cls.inter.info } : null;
      importInfo.top = cls.top ? { pem: cls.top.pem, ...cls.top.info } : null;

      if (!silent) {
        if (pems.length < 3) {
          message.warning(`识别到 ${pems.length} 张证书（预期 3 张：叶子 + 2 级 CA + 1 级 CA）`);
        } else {
          message.success(`已识别 ${pems.length} 张证书并完成分类`);
        }
      }
      return true;
    }

    function onParseChain() {
      parseChainInternal(false);
    }

    function buildLeafRecordView(leafRec) {
      return {
        certPem: leafRec.certPem,
        serial: leafRec.certSerial || '',
        issuer: leafRec.certIssuer || '',
        notBefore: leafRec.certNotBefore || '',
        notAfter: leafRec.certNotAfter || '',
        importedAt: leafRec.certImportedAt || leafRec.certIssuedAt || '',
        subject: leafRec.subject || '',
      };
    }

    async function saveLeafCert() {
      if (!indexedDbOk.value) { message.error('IndexedDB 不可用，无法保存'); return false; }
      if (!importInfo.leaf) { message.error('未识别到叶子证书，无法保存'); return false; }
      if (importInfo.leaf.isCa) {
        message.error('识别到的“叶子证书”实际为 CA 证书（CA:TRUE），已跳过。');
        return false;
      }

      const leafRec = await dbGet(RECORD_KEY);
      if (!leafRec || !leafRec.privateKey) {
        message.error('本机尚未生成 Client Leaf 密钥对，请先点击“生成密钥对与 CSR”后再导入叶子证书。');
        return false;
      }

      leafRec.certPem = importInfo.leaf.pem;
      leafRec.certSerial = importInfo.leaf.serial;
      leafRec.certIssuer = importInfo.leaf.issuer;
      leafRec.certNotBefore = importInfo.leaf.notBefore;
      leafRec.certNotAfter = importInfo.leaf.notAfter;
      leafRec.certImportedAt = new Date().toISOString();

      try {
        await dbPut(RECORD_KEY, leafRec);
        importedLeafRecord.value = buildLeafRecordView(leafRec);
        return true;
      } catch (e) {
        console.error(e);
        message.error('保存叶子证书失败：' + (e && e.message ? e.message : e));
        return false;
      }
    }

    async function saveCaCert(kind) {
      if (!indexedDbOk.value) { message.error('IndexedDB 不可用，无法保存'); return false; }
      const info = importInfo[kind];
      if (!info) { message.error(`未识别到 ${kind === 'top' ? '1 级' : '2 级'} CA 证书`); return false; }
      if (!info.isCa) {
        message.error(`识别到的 ${kind === 'top' ? '1 级' : '2 级'} 证书不是 CA 证书（CA:FALSE），已跳过。`);
        return false;
      }

      const dbKey = kind === 'top' ? IMPORT_KEYS.top : IMPORT_KEYS.inter;
      const label = kind === 'top' ? 'Space 1st-Level CA' : 'Space 2nd-Level CA';

      const record = {
        version: 1,
        kind: 'space-ca-cert',
        level: kind === 'top' ? 'space-top' : 'space-inter',
        label,
        certPem: info.pem,
        serial: info.serial,
        issuer: info.issuer,
        subject: info.subject,
        notBefore: info.notBefore,
        notAfter: info.notAfter,
        isCa: info.isCa,
        pathLen: info.pathLen,
        importedAt: new Date().toISOString(),
        importedBy: 'follower-page',
      };

      try {
        await dbPut(dbKey, record);
        if (kind === 'top') importedTopRecord.value = record;
        else importedInterRecord.value = record;
        return true;
      } catch (e) {
        console.error(e);
        message.error(`${label} 保存失败：` + (e && e.message ? e.message : e));
        return false;
      }
    }

    async function onSaveAll() {
      if (!importInfo.leaf || !importInfo.top || !importInfo.inter) {
        const ok = parseChainInternal(true);
        if (!ok || !importInfo.leaf || !importInfo.top || !importInfo.inter) {
          message.error('证书链不完整，请先粘贴并解析三张证书（叶子 + 2 级 CA + 1 级 CA）。');
          return;
        }
      }

      importSaving.value = true;
      try {
        let okCount = 0;
        if (await saveLeafCert()) okCount++;
        if (await saveCaCert('top')) okCount++;
        if (await saveCaCert('inter')) okCount++;
        if (okCount === 3) {
          message.success('三张证书已全部保存到 IndexedDB');
        } else if (okCount > 0) {
          message.warning(`已保存 ${okCount}/3 张证书，请检查上方错误信息`);
        }
      } finally {
        importSaving.value = false;
      }
    }

    async function loadImportedFromDb(silent) {
      if (!indexedDbOk.value) {
        if (!silent) message.error('IndexedDB 不可用');
        return;
      }
      if (!silent) importLoading.value = true;
      try {
        const t = await dbGet(IMPORT_KEYS.top);
        const i = await dbGet(IMPORT_KEYS.inter);
        const leafRec = await dbGet(RECORD_KEY);

        importedTopRecord.value = t || null;
        importedInterRecord.value = i || null;

        const parts = [];
        if (leafRec && leafRec.certPem) parts.push(leafRec.certPem.trim());
        if (i && i.certPem) parts.push(i.certPem.trim());
        if (t && t.certPem) parts.push(t.certPem.trim());

        if (leafRec && leafRec.certPem) {
          importedLeafRecord.value = buildLeafRecordView(leafRec);
        } else {
          importedLeafRecord.value = null;
        }

        if (parts.length) {
          importForm.chainPem = parts.join('\n');
          parseChainInternal(true);
        } else {
          importForm.chainPem = '';
          importInfo.leaf = null;
          importInfo.inter = null;
          importInfo.top = null;
          importErrors.chain = '';
        }

        if (!silent) {
          if (parts.length) message.success('已从 IndexedDB 加载导入的证书');
          else message.info('IndexedDB 中暂无已导入的证书');
        }
      } catch (e) {
        console.error(e);
        if (!silent) message.error('加载导入证书失败：' + (e && e.message ? e.message : e));
      } finally {
        if (!silent) importLoading.value = false;
      }
    }

    async function onClearImportedFromDb() {
      if (!indexedDbOk.value) { message.error('IndexedDB 不可用'); return; }
      try {
        await dbDelete(IMPORT_KEYS.top);
        await dbDelete(IMPORT_KEYS.inter);

        const leafRec = await dbGet(RECORD_KEY);
        if (leafRec) {
          delete leafRec.certPem;
          delete leafRec.certSerial;
          delete leafRec.certIssuer;
          delete leafRec.certNotBefore;
          delete leafRec.certNotAfter;
          delete leafRec.certImportedAt;
          delete leafRec.certIssuedAt;
          await dbPut(RECORD_KEY, leafRec);
        }

        importedTopRecord.value = null;
        importedInterRecord.value = null;
        importedLeafRecord.value = null;

        importForm.chainPem = '';
        importInfo.leaf = null;
        importInfo.inter = null;
        importInfo.top = null;
        importErrors.chain = '';

        message.success('已清除 IndexedDB 中导入的证书（Client Leaf 私钥保留）');
      } catch (e) {
        console.error(e);
        message.error('清除失败：' + (e && e.message ? e.message : e));
      }
    }

    /* ===== 终端证书：生成 / 加载 / 清除 ===== */
    function fillFormFromAttrs(attrs) {
      if (!Array.isArray(attrs)) return;
      attrs.forEach((a) => { if (a.key in form) form[a.key] = a.value; });
    }

    async function checkStored() {
      if (!indexedDbOk.value) { hasStored.value = false; return false; }
      try {
        const record = await dbGet(RECORD_KEY);
        hasStored.value = !!(record && record.privateKey);
        return hasStored.value;
      } catch (e) {
        hasStored.value = false;
        return false;
      }
    }

    async function loadFromDb(silent) {
      loading.value = true;
      try {
        const record = await dbGet(RECORD_KEY);
        if (!record || !record.privateKey) {
          hasStored.value = false;
          if (!silent) message.warning('IndexedDB 中没有找到 Client Leaf 密钥');
          return false;
        }

        const csrPem = await buildCsrPem(
          record.subjectAttrs,
          record.publicKeySpki,
          record.privateKey
        );

        fillFormFromAttrs(record.subjectAttrs);

        Object.assign(result, {
          csrPem,
          publicKeyPem: pemFromDer(toUint8Array(record.publicKeySpki), 'PUBLIC KEY'),
          subject: record.subject || '',
          createdAt: record.createdAt || '',
        });

        hasStored.value = true;
        if (!silent) message.success('已从 IndexedDB 加载 Client Leaf 密钥并重新生成 CSR 签名');
        return true;
      } catch (e) {
        console.error(e);
        if (!silent) message.error('加载失败：' + (e && e.message ? e.message : e));
        return false;
      } finally {
        loading.value = false;
      }
    }

    async function generateKeyPairAndStore() {
      const attrs = subjectFields.map((f) => ({
        key: f.key,
        value: (form[f.key] || '').trim(),
      }));

      const keyPair = await crypto.subtle.generateKey(
        { name: 'ECDSA', namedCurve: 'P-384' },
        false,
        ['sign', 'verify']
      );

      const spki = new Uint8Array(
        await crypto.subtle.exportKey('spki', keyPair.publicKey)
      );

      const createdAt = new Date().toISOString();
      const subject = attrs
        .filter((a) => a.value)
        .map((a) => `/${a.key}=${a.value}`)
        .join('');

      await dbPut(RECORD_KEY, {
        version: 3,
        type: RECORD_KEY,
        isCa: false,
        pathLen: null,
        extractable: false,
        algorithm: 'ECDSA P-384 / SHA-384',
        subject,
        subjectAttrs: attrs,
        createdAt,
        publicKeySpki: spki,
        privateKey: keyPair.privateKey,
      });

      return { keyPair, spki, attrs, subject, createdAt };
    }

    async function onGenerate() {
      if (!form.C || !form.O || !form.CN) {
        message.warning('请至少填写 C、O、CN');
        return;
      }
      if (!indexedDbOk.value) {
        message.error(dbError.value || 'IndexedDB 不可用，无法安全存储密钥');
        return;
      }

      loading.value = true;
      try {
        const { keyPair, spki, attrs, subject, createdAt } =
          await generateKeyPairAndStore();

        const csrPem = await buildCsrPem(attrs, spki, keyPair.privateKey);

        Object.assign(result, {
          csrPem,
          publicKeyPem: pemFromDer(spki, 'PUBLIC KEY'),
          subject,
          createdAt,
        });

        hasStored.value = true;
        importedLeafRecord.value = null;
        message.success('Client Leaf 非导出密钥已生成并存入 IndexedDB，CSR 已生成（旧的导入叶子证书已失效，请重新导入）');
      } catch (e) {
        console.error(e);
        message.error('生成失败：' + (e && e.message ? e.message : e));
      } finally {
        loading.value = false;
      }
    }

    async function onLoad() {
      await loadFromDb(false);
    }

    async function onClear() {
      try {
        await dbDelete(RECORD_KEY);
        hasStored.value = false;
        importedLeafRecord.value = null;
        Object.assign(result, {
          csrPem: '', publicKeyPem: '',
          subject: '', createdAt: '',
        });
        message.success('已清除 Client Leaf 的 IndexedDB 密钥（导入的叶子证书也一并移除）');
      } catch (e) {
        console.error(e);
        message.error('清除失败：' + (e && e.message ? e.message : e));
      }
    }

    async function copyText(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        message.success('已复制到剪贴板');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); message.success('已复制到剪贴板'); }
        catch (err) { message.error('复制失败，请手动选择文本'); }
        document.body.removeChild(ta);
      }
    }

    function downloadFile(filename, content) {
      if (!content) return;
      const blob = new Blob([content], { type: 'application/x-pem-file' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    onMounted(async () => {
      cryptoOk.value = !!(window.crypto && window.crypto.subtle);
      try {
        await openDB();
        indexedDbOk.value = true;
        dbError.value = '';
      } catch (e) {
        indexedDbOk.value = false;
        dbError.value = (e && e.message) ? e.message : String(e);
        console.warn('IndexedDB 不可用', e);
      }

      if (!indexedDbOk.value) return;

      const stored = await checkStored();
      if (stored) {
        const ok = await loadFromDb(true);
        if (ok) {
          message.success('已从 IndexedDB 自动加载 Client Leaf 密钥与 CSR');
        } else {
          message.warning('检测到 Client Leaf 已保存的密钥，但自动加载失败，请点击“从 IndexedDB 加载”重试');
        }
      }

      await loadImportedFromDb(true);
    });

    return {
      isMobile, collapsed, drawerOpen, selectedKeys, toggleMenu,
      subjectFields, form, result, loading, hasStored, cryptoOk, indexedDbOk, dbError,
      hasResult, subjectString,
      dbName: DB_NAME,
      onGenerate, onLoad, onClear,
      copyText, downloadFile,
      // 导入外部签发的证书链
      importForm, importInfo, importErrors, importLoading, importSaving,
      importedLeafRecord, importedTopRecord, importedInterRecord,
      leafIssuerMatchesInter, interIssuerMatchesTop,
      onParseChain, onSaveAll, loadImportedFromDb, onClearImportedFromDb,
    };
  },
});

app.use(antd);
app.mount('#app');
</script>

</body>
</html>
