<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001529" />
  <title>领头角色 OTMC Client 密钥与 CSR 生成器</title>

  <!-- antdv-next 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/antd.css" />

  <style>
    html, body { margin: 0; padding: 0; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 以下基础样式与 PC 原版完全一致 ===== */

    .logo {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
    }

    .page-header {
      background: #001529;
      color: #fff;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .page-header .collapse-btn {
      color: #fff;
      font-size: 18px;
      padding: 0 8px;
    }
    .page-header .collapse-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .page-content { max-width: 1120px; margin: 0 auto; padding: 24px; }

    .section + .section { margin-top: 16px; }
    .pem-block + .pem-block { margin-top: 20px; }
    .pem-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .pem-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
      font-size: 12px !important;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .secure-box {
      background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px;
      padding: 12px 16px; color: #135200;
    }
    .secure-box.ca { background: #fff2e8; border-color: #ffbb96; color: #612500; }

    /* ===== 证书类型 Segmented —— 颜色区分 ===== */
    .cert-type-seg.ant-segmented {
      padding: 6px !important;
      background: #eef2f7 !important;
      border-radius: 12px !important;
    }

    /* 隐藏原生白色滑块，让每个选项用自身颜色高亮 */
    .cert-type-seg .ant-segmented-thumb {
      display: none !important;
    }

    .cert-type-seg .ant-segmented-item {
      border-radius: 8px !important;
      margin: 0 2px !important;
      transition: background .2s ease, box-shadow .2s ease, color .2s ease !important;
    }

    .cert-type-seg .ant-segmented-item-label {
      padding: 6px 14px !important;
      font-weight: 500 !important;
      line-height: 1.5 !important;
      transition: color .2s ease !important;
    }

    /* 三个证书类型各自的色系（与顺序对应：1 级 CA / 2 级 CA / 叶子） */
    .cert-type-seg .ant-segmented-item:nth-child(1) {
      --c-main: #cf1322;
      --c-soft: #fff1f0;
      --c-edge: #ffccc7;
    }
    .cert-type-seg .ant-segmented-item:nth-child(2) {
      --c-main: #d46b08;
      --c-soft: #fff7e6;
      --c-edge: #ffd591;
    }
    .cert-type-seg .ant-segmented-item:nth-child(3) {
      --c-main: #0958d9;
      --c-soft: #e6f4ff;
      --c-edge: #91caff;
    }

    /* 未选中：浅底 + 主题色文字 + 细边框 */
    .cert-type-seg .ant-segmented-item:not(.ant-segmented-item-selected) {
      background: var(--c-soft) !important;
      box-shadow: inset 0 0 0 1px var(--c-edge) !important;
    }
    .cert-type-seg .ant-segmented-item:not(.ant-segmented-item-selected) .ant-segmented-item-label {
      color: var(--c-main) !important;
    }
    .cert-type-seg .ant-segmented-item:not(.ant-segmented-item-selected):hover {
      box-shadow: inset 0 0 0 1px var(--c-main) !important;
    }

    /* 选中：实心主题色 + 白字 + 阴影 */
    .cert-type-seg .ant-segmented-item-selected {
      background: var(--c-main) !important;
      box-shadow: 0 3px 10px -2px var(--c-main) !important;
    }
    .cert-type-seg .ant-segmented-item-selected .ant-segmented-item-label {
      color: #fff !important;
      font-weight: 600 !important;
    }

    /* ===== 当前类型说明条（带类型色） ===== */
    .type-hint {
      margin: 0 0 16px;
      padding: 10px 12px 10px 14px;
      font-size: 13px;
      line-height: 1.65;
      border-left: 3px solid #d9d9d9;
      border-radius: 0 8px 8px 0;
      background: #f6f8fb;
      color: rgba(0, 0, 0, .65);
      transition: border-color .2s ease, background .2s ease, color .2s ease;
    }
    .type-hint.hint--space-top   { border-left-color: #cf1322; background: #fff8f7; color: #a8071a; }
    .type-hint.hint--space-inter { border-left-color: #d46b08; background: #fffbf0; color: #ad4e00; }
    .type-hint.hint--client-leaf { border-left-color: #0958d9; background: #f4f9ff; color: #003eb3; }

    /* ===== 移动端（≤768px）覆盖样式 ===== */
    @media (max-width: 768px) {
      .page-header {
        height: 56px;
        padding: 0 8px;
        font-size: 15px;
        gap: 4px;
        line-height: normal;
      }
      .page-header .collapse-btn {
        font-size: 18px;
        padding: 0 6px;
      }

      .page-content {
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      }

      .section + .section { margin-top: 12px; }

      .pem-text { font-size: 11px !important; }

      /* 触摸目标更大 */
      .ant-btn { min-height: 36px; }
      .ant-alert { padding: 10px 12px; }

      .cert-type-seg .ant-segmented-item-label {
        padding: 6px 8px !important;
        font-size: 13px !important;
      }
    }

    @media (max-width: 480px) {
      .page-header { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script type="text/x-template" id="app-template">
  <a-layout style="min-height: 100vh">

    <!-- 桌面端左侧菜单 -->
    <a-layout-sider
      v-if="!isMobile"
      v-model:collapsed="collapsed"
      collapsible
      :trigger="null"
      :width="208"
      theme="dark"
    >
      <div class="logo">{{ collapsed ? '导航' : 'OTMC 导航' }}</div>

      <a-menu theme="dark" mode="inline" :selected-keys="selectedKeys">
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-layout-sider>

    <!-- 移动端抽屉导航 -->
    <a-drawer
      v-if="isMobile"
      v-model:open="drawerOpen"
      placement="left"
      :width="230"
      :closable="false"
      :styles="{ body: { padding: 0, background: '#001529' } }"
    >
      <div class="logo">OTMC 导航</div>
      <a-menu
        theme="dark"
        mode="inline"
        :selected-keys="selectedKeys"
        @click="drawerOpen = false"
      >
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-drawer>

    <!-- 右侧主体 -->
    <a-layout>
      <a-layout-header class="page-header">
        <a-button type="text" class="collapse-btn" @click="toggleMenu">☰</a-button>
        <span>领头角色 OTMC Client 密钥与 CSR 生成器</span>
      </a-layout-header>

      <a-layout-content>
        <div class="page-content">

          <a-alert
            v-if="!cryptoOk" type="error" show-icon style="margin-bottom: 16px"
            message="当前环境不支持 Web Crypto API（需要使用 HTTPS 或 localhost 访问）"
          ></a-alert>
          <a-alert
            v-if="!indexedDbOk" type="error" show-icon style="margin-bottom: 16px"
            :message="dbError || '当前环境不支持 IndexedDB，无法安全存储密钥'"
          ></a-alert>

          <!-- ① 证书类型 + Subject -->
          <a-card class="section" title="① 证书类型与 Subject (DN)">
            <a-segmented
              v-model:value="currentTypeKey"
              :options="typeOptions"
              block
              class="cert-type-seg"
              style="margin-bottom: 12px"
              @change="onTypeChange"
            />
            <div class="type-hint" :class="`hint--${currentTypeKey}`">
              {{ currentType.hint }}
            </div>

            <a-form layout="vertical">
              <a-row :gutter="16">
                <a-col :xs="24" :sm="12" :md="8" v-for="f in subjectFields" :key="f.key">
                  <a-form-item :label="f.label">
                    <a-input v-model:value="form[f.key]" :placeholder="f.placeholder" allow-clear />
                  </a-form-item>
                </a-col>
              </a-row>
            </a-form>

            <a-descriptions :column="1" size="small" bordered>
              <a-descriptions-item label="Subject 字符串">
                <span class="mono">{{ subjectString || '(空)' }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="密钥算法">
                ECDSA P-384（secp384r1）· 签名摘要 SHA-384 · 私钥不可导出
              </a-descriptions-item>
              <a-descriptions-item label="证书用途">
                <a-tag v-if="currentType.pathLen !== null" color="red">
                  CA:TRUE · pathlen:{{ currentType.pathLen }} · 可签发下级证书
                </a-tag>
                <a-tag v-else color="blue">End-Entity · clientAuth</a-tag>
              </a-descriptions-item>
              <a-descriptions-item label="等价 openssl">
                <span class="mono">
                  openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp384r1 -out {{ currentType.filePrefix }}.key
                </span>
              </a-descriptions-item>
            </a-descriptions>
          </a-card>

          <!-- ② 生成 -->
          <a-card class="section" title="② 生成 / 存储 / 签发">
            <a-space wrap>
              <a-button type="primary" :loading="loading" :disabled="!cryptoOk || !indexedDbOk" @click="onGenerate">
                生成密钥对与 CSR
              </a-button>
              <a-button :loading="loading" :disabled="!hasStored || !indexedDbOk" @click="onLoad">
                从 IndexedDB 加载
              </a-button>
              <a-button
                type="primary"
                ghost
                :loading="signing"
                :disabled="!hasResult || !cryptoOk || (!currentType.remote && !indexedDbOk)"
                @click="onSign"
              >
                {{ signButtonLabel }}
              </a-button>
              <a-button danger :disabled="(!hasStored && !hasResult) || !indexedDbOk" @click="onClear">
                清除 IndexedDB 中的密钥
              </a-button>
            </a-space>

            <a-typography-paragraph type="secondary" style="margin: 12px 0 0">
              ⚠️ 私钥始终以<b>不可导出</b>模式生成并存入 IndexedDB，无法被浏览器导出为 .key 文件。
              重新生成会<b>覆盖</b>当前证书类型已有的密钥，旧密钥将永久丢失，且无法恢复。
            </a-typography-paragraph>

            <a-typography-paragraph type="secondary" style="margin: 8px 0 0">
              🔏 「{{ signButtonLabel }}」：
              <template v-if="currentType.remote">
                把 CSR 通过 HTTPS 提交到 OTMC 总服务器的签发接口，由服务器侧的
                <span class="mono">client-broker-inter</span> 私钥签发 1 级 CA 证书。
              </template>
              <template v-else>
                用本机 IndexedDB 中上级 CA（<span class="mono">{{ currentType.caName }}</span>）的不可导出私钥，
                在浏览器内完成 X.509 v3 证书签发，签发后的证书会写回本类型的 IndexedDB 记录。
              </template>
            </a-typography-paragraph>
          </a-card>

          <!-- ★ 新增：为其他设备的叶子证书 CSR 签发（仅 Space 2nd-Level CA 页签） -->
          <a-card
            v-if="currentTypeKey === 'space-inter'"
            class="section"
            title="为其他设备的叶子证书 CSR 签发（用本机 Space 2nd-Level CA）"
          >
            <a-alert
              v-if="!hasStored"
              type="warning"
              show-icon
              style="margin-bottom: 12px"
              message="本机尚未保存 Space 2nd-Level CA 私钥，请先在上方「生成密钥对与 CSR」后再来签发。"
            ></a-alert>

            <a-form layout="vertical">
              <a-form-item label="其他设备的叶子证书 CSR（PKCS#10 PEM）">
                <a-textarea
                  v-model:value="extCsrPem"
                  :rows="7"
                  class="pem-text"
                  placeholder="-----BEGIN CERTIFICATE REQUEST-----&#10;...&#10;-----END CERTIFICATE REQUEST-----"
                />
              </a-form-item>
            </a-form>

            <a-space wrap style="margin-bottom: 12px">
              <a-button :disabled="!extCsrPem.trim()" @click="onParseExtCsr(false)">
                解析并验证 CSR
              </a-button>
              <a-button
                type="primary"
                :loading="extSigning"
                :disabled="!extCsrInfo || !cryptoOk || !indexedDbOk || !hasStored"
                @click="onSignExtCsr"
              >
                用本机 2 级 CA 签发该 CSR
              </a-button>
              <a-button :disabled="!extCsrPem && !extCertPem" @click="onClearExt">
                清空
              </a-button>
            </a-space>

            <a-alert
              v-if="extCsrError"
              type="error"
              show-icon
              :message="extCsrError"
              style="margin-bottom: 12px"
            ></a-alert>

            <a-descriptions v-if="extCsrInfo" :column="1" size="small" bordered style="margin-bottom: 12px">
              <a-descriptions-item label="Subject">
                <span class="mono">{{ extCsrInfo.subjectString || '(空)' }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="公钥算法">
                <span class="mono">{{ extCsrInfo.keyAlgLabel }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="CSR 自签名校验">
                <a-tag v-if="extCsrVerify === 'ok'" color="green">验证通过</a-tag>
                <a-tag v-else-if="extCsrVerify === 'fail'" color="red">验证失败（CSR 可能被篡改）</a-tag>
                <a-tag v-else-if="extCsrVerify === 'unsupported'" color="orange">算法不支持，未验证</a-tag>
                <a-tag v-else>未验证</a-tag>
              </a-descriptions-item>
              <a-descriptions-item label="将签发的扩展">
                <span class="mono">
                  basicConstraints=critical,CA:FALSE；keyUsage=critical,digitalSignature；extendedKeyUsage=clientAuth
                </span>
              </a-descriptions-item>
            </a-descriptions>

            <div class="pem-block" v-if="extCertPem">
              <div class="pem-head">
                <span>
                  <a-typography-text strong>已签发证书链（叶子 + 2 级 CA + 1 级 CA）</a-typography-text>
                  <a-tag color="purple" style="margin-left: 8px">{{ extChainFileName }}</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(extCertChainPem || extCertPem)">复制证书链</a-button>
                  <a-button size="small" @click="downloadFile(extChainFileName, extCertChainPem || extCertPem)">下载证书链</a-button>
                </a-space>
              </div>

              <a-alert
                v-if="extChainWarnings.length"
                type="warning"
                show-icon
                style="margin-bottom: 8px"
              >
                <template #message>
                  <div>证书链不完整：</div>
                  <div v-for="(w, i) in extChainWarnings" :key="i">· {{ w }}</div>
                </template>
              </a-alert>
              <a-alert
                v-else-if="extCertChainPem"
                type="success"
                show-icon
                style="margin-bottom: 8px"
                message="证书链完整：叶子证书 → Space 2nd-Level CA → Space 1st-Level CA"
              ></a-alert>

              <a-descriptions :column="1" size="small" bordered style="margin-bottom: 8px">
                <a-descriptions-item label="叶子证书 Serial">
                  <span class="mono">{{ extCertMeta.serial || '-' }}</span>
                </a-descriptions-item>
                <a-descriptions-item label="叶子证书 Issuer">
                  <span class="mono">{{ extCertMeta.issuer || '-' }}</span>
                </a-descriptions-item>
                <a-descriptions-item label="叶子证书有效期">
                  <span class="mono">{{ extCertMeta.notBefore || '-' }} → {{ extCertMeta.notAfter || '-' }}</span>
                </a-descriptions-item>
                <a-descriptions-item label="链结构">
                  <span class="mono">
                    叶子证书
                    <template v-if="extChainIncludes.inter"> → Space 2nd-Level CA</template>
                    <template v-if="extChainIncludes.top"> → Space 1st-Level CA</template>
                  </span>
                </a-descriptions-item>
              </a-descriptions>

              <a-textarea :rows="18" :value="extCertChainPem || extCertPem" readonly class="pem-text" />

              <a-divider style="margin: 12px 0 8px">单独操作叶子证书</a-divider>
              <a-space wrap>
                <a-button size="small" @click="copyText(extCertPem)">复制叶子证书</a-button>
                <a-button size="small" @click="downloadFile(extCertFileName, extCertPem)">下载叶子证书</a-button>
              </a-space>
            </div>
          </a-card>

          <!-- ③ 结果 -->
          <a-card v-if="hasResult" class="section" title="③ 结果">
            <a-descriptions :column="2" size="small" bordered style="margin-bottom: 16px">
              <a-descriptions-item label="证书类型">{{ currentType.label }}</a-descriptions-item>
              <a-descriptions-item label="生成时间">{{ result.createdAt }}</a-descriptions-item>
              <a-descriptions-item label="IndexedDB Record" :span="2">
                <span class="mono">{{ dbName }} / {{ currentType.recordKey }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="Subject" :span="2">
                <span class="mono">{{ result.subject }}</span>
              </a-descriptions-item>
              <a-descriptions-item label="私钥类型" :span="2">
                <a-tag color="green">不可导出（extractable=false）</a-tag>
                <a-tag v-if="currentType.isCa" color="red" style="margin-left: 6px">CA 密钥</a-tag>
              </a-descriptions-item>
            </a-descriptions>

            <!-- 私钥（始终不可导出） -->
            <div class="pem-block">
              <div class="pem-head">
                <span>
                  <a-typography-text strong>私钥</a-typography-text>
                  <a-tag color="green" style="margin-left: 8px">不可导出</a-tag>
                  <a-tag v-if="currentType.isCa" color="red" style="margin-left: 4px">CA 密钥</a-tag>
                </span>
              </div>
              <div class="secure-box" :class="{ ca: currentType.isCa }">
                🔒 私钥为不可导出 CryptoKey，已安全存储在 IndexedDB 中。
                浏览器拒绝任何 <span class="mono">exportKey()</span> 读取私钥明文的请求；
                页面仅保留 <span class="mono">sign()</span> 签名能力。无法下载 .key 文件。
                <template v-if="currentType.isCa">
                  <br/>该密钥用于签发下级证书，请妥善保管 IndexedDB 所在浏览器配置。
                </template>
              </div>
            </div>

            <!-- 公钥 -->
            <div class="pem-block" v-if="result.publicKeyPem">
              <div class="pem-head">
                <span>
                  <a-typography-text strong>公钥 (SPKI)</a-typography-text>
                  <a-tag color="blue" style="margin-left: 8px">{{ currentType.filePrefix }}.pub</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(result.publicKeyPem)">复制</a-button>
                  <a-button size="small" @click="downloadFile(currentType.filePrefix + '.pub', result.publicKeyPem)">下载</a-button>
                </a-space>
              </div>
              <a-textarea :rows="6" :value="result.publicKeyPem" readonly class="pem-text" />
            </div>

            <!-- CSR -->
            <div class="pem-block" v-if="result.csrPem">
              <div class="pem-head">
                <span>
                  <a-typography-text strong>CSR (PKCS#10 · SHA-384)</a-typography-text>
                  <a-tag color="blue" style="margin-left: 8px">{{ currentType.filePrefix }}.csr</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(result.csrPem)">复制</a-button>
                  <a-button size="small" @click="downloadFile(currentType.filePrefix + '.csr', result.csrPem)">下载</a-button>
                </a-space>
              </div>
              <a-textarea :rows="7" :value="result.csrPem" readonly class="pem-text" />
            </div>

            <!-- 已签发证书 -->
            <div class="pem-block" v-if="result.certPem">
              <div class="pem-head">
                <span>
                  <a-typography-text strong>已签发证书 (X.509 v3)</a-typography-text>
                  <a-tag color="purple" style="margin-left: 8px">{{ currentType.filePrefix }}.crt</a-tag>
                  <a-tag v-if="result.certIsMock" color="orange" style="margin-left: 4px">MOCK</a-tag>
                </span>
                <a-space>
                  <a-button size="small" @click="copyText(result.certPem)">复制</a-button>

              <a-alert

              >

                  <span class="mono">{{ currentType.caName }}.crt</span> /

              注意 1：CSR 本身不携带证书扩展。签发时请使用上方展示的

          <!-- ④ 安全说明 -->
          <a-card class="section" title="④ 关于此安全方案的边界说明">
            <a-typography-paragraph>
              <b>适用场景</b>：私钥仅需在<b>当前浏览器内</b>完成签名操作，且不需要将 .key 文件分发给其他 MQTT 客户端。
            </a-typography-paragraph>
            <a-typography-paragraph>
              <b>不适用场景</b>：需要把私钥交给 mosquitto_pub、mqtt.js（Node）、ESP32 等外部 MQTT 客户端。

            </a-typography-paragraph>
            <a-typography-paragraph type="danger" style="margin-bottom: 0">
              <b>威胁模型</b>：非导出密钥可防止私钥字节被 XSS 读取并外传；但恶意脚本仍可调用
              <span class="mono">crypto.subtle.sign()</span> 对任意数据签名（“代理签名”）。
              若你的应用需要抵抗此攻击，请使用 BFF 模式，由服务器持有私钥。
              对于 <b>Space 1st/2nd-Level CA</b> 这类高价值密钥，更建议在离线/HSM 环境用 openssl 生成并保管。

<!-- 3. antdv-next UMD -->
<script src="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/antd.js"></script>

<!-- 4. 业务脚本 -->
<script>
const { createApp, reactive, ref, computed, watch, onMounted, onBeforeUnmount } = Vue;

// antdv-next 可能不暴露 message，做防御性降级
const message = (antd && antd.message) || {
  success: (m) => console.log('[success]', m),
  error: (m) => console.error('[error]', m),
  warning: (m) => console.warn('[warning]', m),
  info: (m) => console.info('[info]', m),
};

const textEncoder = new TextEncoder();

function concatBytes(...chunks) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function derLength(len) {
  if (len < 0x80) return new Uint8Array([len]);
  const tmp = [];
  let n = len;
  while (n > 0) { tmp.unshift(n & 0xff); n = Math.floor(n / 256); }
  return new Uint8Array([0x80 | tmp.length, ...tmp]);
}

function tlv(tag, content) {
  return concatBytes(new Uint8Array([tag]), derLength(content.length), content);
}

const derSequence = (...items) => tlv(0x30, concatBytes(...items));
const derSet = (...items) => tlv(0x31, concatBytes(...items));

function derInteger(bytes) {
  let i = 0;
  while (i < bytes.length - 1 && bytes[i] === 0) i++;
  let v = bytes.subarray(i);
  if (v[0] & 0x80) v = concatBytes(new Uint8Array([0x00]), v);
  return tlv(0x02, v);
}

function derOid(oidStr) {
  const parts = oidStr.split('.').map(Number);
  const bytes = [40 * parts[0] + parts[1]];
  for (let i = 2; i < parts.length; i++) {
    let n = parts[i];
    const buf = [n & 0x7f];
    n = Math.floor(n / 128);
    while (n > 0) { buf.unshift((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    bytes.push(...buf);
  }
  return tlv(0x06, new Uint8Array(bytes));
}

const derUtf8 = (s) => tlv(0x0c, textEncoder.encode(s));
const derBitString = (bytes) => tlv(0x03, concatBytes(new Uint8Array([0x00]), bytes));
const derBool = (b) => tlv(0x01, new Uint8Array([b ? 0xff : 0x00]));
const derOctetString = (bytes) => tlv(0x04, bytes);
const derBitStringN = (bytes, unusedBits) =>
  tlv(0x03, concatBytes(new Uint8Array([unusedBits]), bytes));

function ecdsaRawToDer(raw) {
  const half = raw.length / 2;
  return derSequence(
    derInteger(raw.subarray(0, half)),
    derInteger(raw.subarray(half, half * 2))
  );
}

function pemFromDer(der, label) {
  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < der.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, der.subarray(i, i + CHUNK));
  }
  const b64 = btoa(binary);
  const lines = (b64.match(/.{1,64}/g) || []).join('\n');
  return `-----BEGIN ${label}-----\n${lines}\n-----END ${label}-----`;
}

/* ===========================================================================
 * 极简 X.509 / DER 解析（仅用于展示证书元数据：serial / issuer / 有效期）
 * 不参与证书签发逻辑，只读取 PEM 内容。
 * ========================================================================= */

function readTLV(buf, offset) {
  const start = offset;
  const tag = buf[offset++];
  let len = buf[offset++];
  if (len & 0x80) {
    const n = len & 0x7f;
    len = 0;
    for (let i = 0; i < n; i++) len = (len << 8) | buf[offset++];
  }
  const valueStart = offset;
  const valueEnd = offset + len;
  return { tag, len, valueStart, valueEnd, rawStart: start, rawEnd: valueEnd };
}

function decodeDerString(tag, bytes) {
  if (tag === 0x1e) { // BMPString (UTF-16BE)
    let s = '';
    for (let i = 0; i + 1 < bytes.length; i += 2) {
      s += String.fromCharCode((bytes[i] << 8) | bytes[i + 1]);
    }
    return s;
  }
  // UTF8String / PrintableString / IA5String / TeletexString 等按 UTF-8 兜底
  return new TextDecoder().decode(bytes);
}

function decodeOid(buf, tlv) {
  const bytes = buf.subarray(tlv.valueStart, tlv.valueEnd);
  const parts = [];
  let v = 0;
  for (let i = 0; i < bytes.length; i++) {
    v = (v << 7) | (bytes[i] & 0x7f);
    if (!(bytes[i] & 0x80)) { parts.push(v); v = 0; }
  }
  if (parts.length) {
    const first = parts[0];
    const a = first < 40 ? 0 : first < 80 ? 1 : 2;
    parts[0] = a;
    parts.splice(1, 0, first - a * 40);
  }
  return parts.join('.');
}

const OID_SHORT = {
  '2.5.4.3': 'CN', '2.5.4.6': 'C', '2.5.4.7': 'L',
  '2.5.4.8': 'ST', '2.5.4.10': 'O', '2.5.4.11': 'OU',
  '2.5.4.5': 'serialNumber', '1.2.840.113549.1.9.1': 'emailAddress',
};

function parseNameAttrs(buf, tlv) {
  const attrs = [];
  let off = tlv.valueStart;
  while (off < tlv.valueEnd) {
    const rdn = readTLV(buf, off);      // SET OF AttributeTypeAndValue
    let aoff = rdn.valueStart;
    while (aoff < rdn.valueEnd) {
      const atv = readTLV(buf, aoff);   // SEQUENCE { OID, value }
      const oidTlv = readTLV(buf, atv.valueStart);
      const valTlv = readTLV(buf, oidTlv.rawEnd);
      attrs.push({
        oid: decodeOid(buf, oidTlv),
        value: decodeDerString(valTlv.tag, buf.subarray(valTlv.valueStart, valTlv.valueEnd)),
      });
      aoff = atv.rawEnd;
    }
    off = rdn.rawEnd;
  }
  return attrs;
}

function formatNameAttrs(attrs) {
  // DER 中 RDNSequence 顺序：C, ST, O, CN（与 OpenSSL -issuer 输出一致），无需反转
  return attrs
    .map((a) => `${OID_SHORT[a.oid] || a.oid}=${a.value}`)
    .join(', ');
}

function parseDerTime(tag, str) {
  let yyyy, mm, dd, hh, mi, ss;
  if (tag === 0x17) {          // UTCTime: YYMMDDHHMMSSZ
    const yy = parseInt(str.slice(0, 2), 10);
    yyyy = String(yy >= 50 ? 1900 + yy : 2000 + yy);
    mm = str.slice(2, 4); dd = str.slice(4, 6);
    hh = str.slice(6, 8); mi = str.slice(8, 10); ss = str.slice(10, 12);
  } else if (tag === 0x18) {   // GeneralizedTime: YYYYMMDDHHMMSSZ
    yyyy = str.slice(0, 4); mm = str.slice(4, 6); dd = str.slice(6, 8);
    hh = str.slice(8, 10); mi = str.slice(10, 12); ss = str.slice(12, 14);
  } else {
    return str;
  }
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss} UTC`;
}

/**
 * 从 PEM 证书中解析出 serial / issuer / subject / 有效期。
 * 解析失败会抛异常（调用方负责 try/catch，用于 mock 占位证书场景）。
 */
function parseX509Pem(pem) {
  const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

  const cert = readTLV(buf, 0);               // Certificate SEQUENCE
  const tbs  = readTLV(buf, cert.valueStart); // TBSCertificate SEQUENCE

  let off = tbs.valueStart;
  if (buf[off] === 0xa0) off = readTLV(buf, off).rawEnd; // version [0] EXPLICIT

  const serialTlv = readTLV(buf, off);
  const serialBytes = buf.subarray(serialTlv.valueStart, serialTlv.valueEnd);
  const serial = Array.from(serialBytes, (b) => b.toString(16).padStart(2, '0'))
    .join(':').toUpperCase();
  off = serialTlv.rawEnd;

  off = readTLV(buf, off).rawEnd;             // signature AlgorithmIdentifier

  const issuerTlv = readTLV(buf, off);
  const issuerAttrs = parseNameAttrs(buf, issuerTlv);
  off = issuerTlv.rawEnd;

  const validityTlv = readTLV(buf, off);
  const nbTlv = readTLV(buf, validityTlv.valueStart);
  const naTlv = readTLV(buf, nbTlv.rawEnd);
  const notBefore = parseDerTime(nbTlv.tag,
    new TextDecoder().decode(buf.subarray(nbTlv.valueStart, nbTlv.valueEnd)));
  const notAfter  = parseDerTime(naTlv.tag,
    new TextDecoder().decode(buf.subarray(naTlv.valueStart, naTlv.valueEnd)));
  off = validityTlv.rawEnd;

  const subjectTlv = readTLV(buf, off);
  const subjectAttrs = parseNameAttrs(buf, subjectTlv);

  return {
    serial,
    issuer:  formatNameAttrs(issuerAttrs),
    subject: formatNameAttrs(subjectAttrs),
    notBefore,
    notAfter,
  };
}

function toUint8Array(x) {
  if (x instanceof Uint8Array) return x;
  if (x instanceof ArrayBuffer) return new Uint8Array(x);
  if (ArrayBuffer.isView(x)) return new Uint8Array(x.buffer, x.byteOffset, x.byteLength);
  return new Uint8Array(x);
}

function fmtUTC(date) {
  return date.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
}

const ATTR_OIDS = {
  C: '2.5.4.6', ST: '2.5.4.8', L: '2.5.4.7',
  O: '2.5.4.10', OU: '2.5.4.11', CN: '2.5.4.3',
};
const OID_ECDSA_WITH_SHA384 = '1.2.840.10045.4.3.3';

/* X.509 扩展 OID */
const OID_BASIC_CONSTRAINTS  = '2.5.29.19';
const OID_KEY_USAGE          = '2.5.29.15';
const OID_EXT_KEY_USAGE      = '2.5.29.37';
const OID_SUBJECT_KEY_ID     = '2.5.29.14';
const OID_AUTHORITY_KEY_ID   = '2.5.29.35';
const OID_CLIENT_AUTH        = '1.3.6.1.5.5.7.3.2';

/** 由 Subject 属性列表构造 DER Name（RDNSequence） */
function nameFromAttrs(subjectAttrs) {
  const rdnSeq = subjectAttrs
    .filter((a) => a.value)
    .map((a) => {
      const oid = ATTR_OIDS[a.key];
      if (!oid) throw new Error('不支持的 Subject 属性: ' + a.key);
      return derSet(derSequence(derOid(oid), derUtf8(a.value)));
    });
  return derSequence(...rdnSeq);
}

/** UTCTime（1950–2049）或 GeneralizedTime */
function derTime(date) {
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const y = date.getUTCFullYear();
  const body = pad(date.getUTCMonth() + 1) + pad(date.getUTCDate()) +
               pad(date.getUTCHours()) + pad(date.getUTCMinutes()) +
               pad(date.getUTCSeconds()) + 'Z';
  if (y >= 1950 && y <= 2049) {
    return tlv(0x17, textEncoder.encode(pad(y % 100) + body));
  }
  return tlv(0x18, textEncoder.encode(pad(y, 4) + body));
}

async function buildCsrPem(subjectAttrs, publicKeySpki, privateKey) {
  const spki = toUint8Array(publicKeySpki);
  const subject = nameFromAttrs(subjectAttrs);

  const cri = derSequence(
    derInteger(new Uint8Array([0x00])),
    subject,
    spki,
    tlv(0xa0, new Uint8Array(0))
  );

  const rawSig = new Uint8Array(
    await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-384' }, privateKey, cri)
  );
  const sigDer = ecdsaRawToDer(rawSig);

  const csrDer = derSequence(
    cri,
    derSequence(derOid(OID_ECDSA_WITH_SHA384)),
    derBitString(sigDer)
  );

  return pemFromDer(csrDer, 'CERTIFICATE REQUEST');
}

/* ---------------------------------------------------------------------------
 * 本地 X.509 v3 证书签发
 * 使用上级 CA 的不可导出私钥（CryptoKey）在浏览器内对 TBSCertificate 签名。
 *
 * subjectDer 参数：可选。传入外部 CSR 的 Subject DER 时直接复用，
 * 可原样保留任意 Subject 属性及其原始编码（如 emailAddress 的 IA5String）。
 * ------------------------------------------------------------------------- */
async function issueCertificate({
  subjectAttrs,
  subjectDer: subjectDerOverride,
  subjectSpki,
  issuerAttrs,
  issuerSpki,
  issuerPrivateKey,
  isCa,
  pathLen,
}) {
  const subjectDer = subjectDerOverride
    ? toUint8Array(subjectDerOverride)
    : nameFromAttrs(subjectAttrs);
  const issuerDer = nameFromAttrs(issuerAttrs);
  const spkiDer = toUint8Array(subjectSpki);

  // 序列号：16 字节随机，最高位清零保证正整数
  const serial = new Uint8Array(16);
  crypto.getRandomValues(serial);
  serial[0] &= 0x7f;
  if (serial[0] === 0) serial[0] = 0x01;

  const nowMs = Date.now();
  const notBefore = new Date(nowMs - 60 * 1000);
  const notAfter = new Date(nowMs + 36500 * 86400 * 1000);

  // ecdsa-with-SHA384，RFC 5758 规定参数必须省略
  const sigAlg = derSequence(derOid(OID_ECDSA_WITH_SHA384));

  // SKI / AKI：取各自 SPKI 的 SHA-1（演示用，RFC 5280 严格定义是对 BIT STRING 内容取摘要）
  const ski = new Uint8Array(await crypto.subtle.digest('SHA-1', spkiDer));
  const aki = new Uint8Array(
    await crypto.subtle.digest('SHA-1', toUint8Array(issuerSpki))
  );

  const ext = (oid, critical, value) => derSequence(
    ...(critical
      ? [derOid(oid), derBool(true), derOctetString(value)]
      : [derOid(oid), derOctetString(value)])
  );

  const exts = [];

  // basicConstraints
  exts.push(ext(
    OID_BASIC_CONSTRAINTS,
    true,
    isCa
      ? derSequence(derBool(true), derInteger(new Uint8Array([pathLen])))
      : derSequence()
  ));

  // keyUsage
  exts.push(ext(
    OID_KEY_USAGE,
    true,
    isCa
      ? derBitStringN(new Uint8Array([0x06]), 1)  // keyCertSign(5) | cRLSign(6)
      : derBitStringN(new Uint8Array([0x80]), 7)  // digitalSignature(0)
  ));

  // extendedKeyUsage：仅叶子证书
  if (!isCa) {
    exts.push(ext(OID_EXT_KEY_USAGE, false, derSequence(derOid(OID_CLIENT_AUTH))));
  }

  // subjectKeyIdentifier
  exts.push(ext(OID_SUBJECT_KEY_ID, false, derOctetString(ski)));

  // authorityKeyIdentifier（keyIdentifier [0] IMPLICIT OCTET STRING）
  exts.push(ext(OID_AUTHORITY_KEY_ID, false, derSequence(tlv(0x80, aki))));

  // TBSCertificate
  const tbs = derSequence(
    tlv(0xa0, derInteger(new Uint8Array([0x02]))),  // version v3
    derInteger(serial),
    sigAlg,
    issuerDer,
    derSequence(derTime(notBefore), derTime(notAfter)),
    subjectDer,
    spkiDer,
    tlv(0xa3, derSequence(...exts))                 // extensions [3] EXPLICIT
  );

  const rawSig = new Uint8Array(
    await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-384' }, issuerPrivateKey, tbs)
  );

  const certDer = derSequence(tbs, sigAlg, derBitString(ecdsaRawToDer(rawSig)));

  return {
    pem: pemFromDer(certDer, 'CERTIFICATE'),
    serial: Array.from(serial, (b) => b.toString(16).padStart(2, '0'))
      .join(':').toUpperCase(),
    notBefore: fmtUTC(notBefore),
    notAfter: fmtUTC(notAfter),
  };
}

/* ===========================================================================
 * 外部 CSR（PKCS#10）解析与验签
 * 用于「为其他设备的叶子证书 CSR 签发」：解析出 Subject DER 与公钥 SPKI，
 * 再用本机 Space 2nd-Level CA 私钥签发出 End-Entity 证书。
 * ========================================================================= */

const OID_EC_PUBLIC_KEY  = '1.2.840.10045.2.1';
const OID_RSA_PUBLIC_KEY = '1.2.840.113549.1.1.1';
const OID_ED25519        = '1.3.101.112';

const CURVE_OID_TO_NAME = {
  '1.2.840.10045.3.1.7': 'P-256',
  '1.3.132.0.34': 'P-384',
  '1.3.132.0.35': 'P-521',
};
const CURVE_HALF_LEN = { 'P-256': 32, 'P-384': 48, 'P-521': 66 };

const ECDSA_SIG_OID_TO_HASH = {
  '1.2.840.10045.4.3.2': 'SHA-256',
  '1.2.840.10045.4.3.3': 'SHA-384',
  '1.2.840.10045.4.3.4': 'SHA-512',
};
const RSA_SIG_OID_TO_HASH = {
  '1.2.840.113549.1.1.11': 'SHA-256',
  '1.2.840.113549.1.1.12': 'SHA-384',
  '1.2.840.113549.1.1.13': 'SHA-512',
};

/** PEM → DER 字节 */
function pemToDerBytes(pem) {
  const b64 = String(pem)
    .replace(/-----BEGIN [^-]+-----/g, '')
    .replace(/-----END [^-]+-----/g, '')
    .replace(/\s+/g, '');
  if (!b64) throw new Error('PEM 内容为空');
  let bin;
  try {
    bin = atob(b64);
  } catch (e) {
    throw new Error('PEM Base64 解码失败');
  }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** 读取 SubjectPublicKeyInfo 的 AlgorithmIdentifier */
function parseSpkiAlgorithm(spkiDer) {
  const buf = toUint8Array(spkiDer);
  const top = readTLV(buf, 0);
  if (top.tag !== 0x30) throw new Error('SPKI 结构异常：缺少外层 SEQUENCE');
  const alg = readTLV(buf, top.valueStart);
  if (alg.tag !== 0x30) throw new Error('SPKI 结构异常：缺少 AlgorithmIdentifier');
  const oidTlv = readTLV(buf, alg.valueStart);
  if (oidTlv.tag !== 0x06) throw new Error('SPKI 结构异常：缺少算法 OID');

  let paramsOid = null;
  if (oidTlv.rawEnd < alg.valueEnd) {
    const p = readTLV(buf, oidTlv.rawEnd);
    if (p.tag === 0x06) paramsOid = decodeOid(buf, p);
  }
  return { oid: decodeOid(buf, oidTlv), paramsOid };
}

/** 生成人类可读的公钥算法描述 */
function describePublicKey(spkiDer) {
  try {
    const alg = parseSpkiAlgorithm(spkiDer);
    if (alg.oid === OID_EC_PUBLIC_KEY) {
      const curve = CURVE_OID_TO_NAME[alg.paramsOid] || alg.paramsOid || '未知曲线';
      return 'ECDSA / ' + curve;
    }
    if (alg.oid === OID_RSA_PUBLIC_KEY) return 'RSA';
    if (alg.oid === OID_ED25519) return 'Ed25519';
    return 'OID ' + alg.oid;
  } catch (e) {
    return '未知';
  }
}

/**
 * 解析 PKCS#10 CSR（PEM）：
 *   CertificationRequest ::= SEQUENCE {
 *     certificationRequestInfo CertificationRequestInfo,
 *     signatureAlgorithm        AlgorithmIdentifier,
 *     signature                 BIT STRING }
 *   CertificationRequestInfo ::= SEQUENCE {
 *     version INTEGER, subject Name, subjectPKInfo SPKI,
 *     attributes [0] IMPLICIT ... }
 */
function parseCsrPem(pem) {
  const buf = pemToDerBytes(pem);
  if (buf.length < 16) throw new Error('数据过短，不是有效的 CSR');

  const top = readTLV(buf, 0);
  if (top.tag !== 0x30) throw new Error('不是合法的 PKCS#10 结构（缺少外层 SEQUENCE）');

  const cri = readTLV(buf, top.valueStart);
  if (cri.tag !== 0x30) throw new Error('CSR 结构异常：缺少 CertificationRequestInfo');

  let off = cri.valueStart;

  const versionTlv = readTLV(buf, off);
  if (versionTlv.tag !== 0x02) throw new Error('CSR 结构异常：版本字段不是 INTEGER');
  off = versionTlv.rawEnd;

  const subjectTlv = readTLV(buf, off);
  if (subjectTlv.tag !== 0x30) throw new Error('CSR 结构异常：Subject 字段不是 SEQUENCE');
  off = subjectTlv.rawEnd;

  const spkiTlv = readTLV(buf, off);
  if (spkiTlv.tag !== 0x30) throw new Error('CSR 结构异常：公钥字段不是 SEQUENCE');

  const sigAlgTlv = readTLV(buf, cri.rawEnd);
  if (sigAlgTlv.tag !== 0x30) throw new Error('CSR 结构异常：缺少签名算法');

  const sigAlgOidTlv = readTLV(buf, sigAlgTlv.valueStart);
  if (sigAlgOidTlv.tag !== 0x06) throw new Error('CSR 结构异常：缺少签名算法 OID');

  const sigBitsTlv = readTLV(buf, sigAlgTlv.rawEnd);
  if (sigBitsTlv.tag !== 0x03) throw new Error('CSR 结构异常：缺少签名 BIT STRING');
  if (sigBitsTlv.valueEnd - sigBitsTlv.valueStart < 2) throw new Error('CSR 签名为空');

  const subjectAttrs = parseNameAttrs(buf, subjectTlv);
  const subjectString = formatNameAttrs(subjectAttrs);
  const cnAttr = subjectAttrs.find((a) => a.oid === '2.5.4.3');
  const spkiDer = buf.slice(spkiTlv.rawStart, spkiTlv.rawEnd);

  return {
    subjectAttrs,
    subjectString,
    cn: cnAttr ? cnAttr.value : '',
    subjectDer: buf.slice(subjectTlv.rawStart, subjectTlv.rawEnd),
    spkiDer,
    criDer: buf.slice(cri.rawStart, cri.rawEnd),
    sigAlgOid: decodeOid(buf, sigAlgOidTlv),
    signature: buf.slice(sigBitsTlv.valueStart + 1, sigBitsTlv.valueEnd),
    keyAlgLabel: describePublicKey(spkiDer),
  };
}

/** 去掉前导 0 并左填充到固定长度（DER INTEGER → 定长大端） */
function intToFixedBytes(bytes, len) {
  let i = 0;
  while (i < bytes.length - 1 && bytes[i] === 0) i++;
  const v = bytes.subarray(i);
  if (v.length > len) throw new Error('签名整数超出曲线长度');
  const out = new Uint8Array(len);
  out.set(v, len - v.length);
  return out;
}

/** ECDSA DER 签名（SEQUENCE{r,s}）→ WebCrypto 需要的 r||s */
function ecdsaDerToRaw(der, halfLen) {
  const buf = toUint8Array(der);
  const seq = readTLV(buf, 0);
  if (seq.tag !== 0x30) throw new Error('ECDSA 签名不是 SEQUENCE');
  const rTlv = readTLV(buf, seq.valueStart);
  if (rTlv.tag !== 0x02) throw new Error('ECDSA 签名 r 不是 INTEGER');
  const sTlv = readTLV(buf, rTlv.rawEnd);
  if (sTlv.tag !== 0x02) throw new Error('ECDSA 签名 s 不是 INTEGER');

  const out = new Uint8Array(halfLen * 2);
  out.set(intToFixedBytes(buf.subarray(rTlv.valueStart, rTlv.valueEnd), halfLen), 0);
  out.set(intToFixedBytes(buf.subarray(sTlv.valueStart, sTlv.valueEnd), halfLen), halfLen);
  return out;
}

/**
 * 校验 CSR 的自签名。返回 true/false；
 * 遇到不支持的算法时抛异常（调用方按「不支持验证」处理）。
 */
async function verifyCsrSignature(info) {
  const alg = parseSpkiAlgorithm(info.spkiDer);
  const subtle = crypto.subtle;

  if (alg.oid === OID_EC_PUBLIC_KEY) {
    const curve = CURVE_OID_TO_NAME[alg.paramsOid];
    const hash = ECDSA_SIG_OID_TO_HASH[info.sigAlgOid];
    if (!curve) throw new Error('不支持的 EC 曲线 OID：' + alg.paramsOid);
    if (!hash) throw new Error('不支持的 ECDSA 签名算法 OID：' + info.sigAlgOid);

    const key = await subtle.importKey(
      'spki', toUint8Array(info.spkiDer),
      { name: 'ECDSA', namedCurve: curve }, false, ['verify']
    );
    const raw = ecdsaDerToRaw(info.signature, CURVE_HALF_LEN[curve]);
    return await subtle.verify(
      { name: 'ECDSA', hash }, key, raw, toUint8Array(info.criDer)
    );
  }

  if (alg.oid === OID_RSA_PUBLIC_KEY) {
    const hash = RSA_SIG_OID_TO_HASH[info.sigAlgOid];
    if (!hash) throw new Error('不支持的 RSA 签名算法 OID：' + info.sigAlgOid);

    const key = await subtle.importKey(
      'spki', toUint8Array(info.spkiDer),
      { name: 'RSASSA-PKCS1-v1_5', hash }, false, ['verify']
    );
    return await subtle.verify(
      'RSASSA-PKCS1-v1_5', key,
      toUint8Array(info.signature), toUint8Array(info.criDer)
    );
  }

  throw new Error('暂不支持校验该公钥算法：' + alg.oid);
}

const OTMC_SIGN_ENDPOINT = '/api/v1/space/sign/client/space-1st-level';
const USE_MOCK_SIGN_SERVER = false; // ← 接入真实服务端时改成 false

const MOCK_CERT_PEM = [
  '-----BEGIN CERTIFICATE-----',
  'MOCKCERTIFICATEFROMOTMCSERVERREPLACEWITHREALRESPONSEMOCKCERTIFICATE',
  'FROMOTMCSERVERREPLACEWITHREALRESPONSEMOCKCERTIFICATEFROMOTMCSERVER',
  '-----END CERTIFICATE-----',
].join('\n');

/**
 * 向 OTMC 总服务器请求签发 1 级 CA 证书。
 * 真实实现：POST CSR 到签发接口，服务端用 client-broker-inter 私钥签发后返回 PEM。
 *
 * 注意：服务端返回值可能只有 certificate（PEM），不含 serial / issuer 等元数据。
 * 元数据统一由 onSign() 中的 parseX509Pem() 从 PEM 解析，不依赖这里返回的字段。
 */
async function requestRemoteSignature(csrPem, type) {
  const payload = {
    csr: csrPem,
    profile: 'space-1st-level',
    keyUsage: ['keyCertSign', 'cRLSign'],
    basicConstraints: { cA: true, pathLen: type.pathLen },
    requestedDays: 36500,
    client: 'otmc-browser-leader',
  };

  // ---------- dummy 模式：不发真实请求，返回占位证书 ----------
  if (USE_MOCK_SIGN_SERVER) {
    console.info('[mock] POST', OTMC_SIGN_ENDPOINT, payload);
    await new Promise((r) => setTimeout(r, 900));
    const nowMs = Date.now();
    return {
      pem: MOCK_CERT_PEM,
      serial: '00:MOCK:00:00:00:01',
      issuer: 'CN=OTMC Client Broker Intermediate CA（远端 · mock）',
      notBefore: fmtUTC(new Date(nowMs - 60 * 1000)),
      notAfter: fmtUTC(new Date(nowMs + 36500 * 86400 * 1000)),
      isMock: true,
    };
  }

  // ---------- 真实请求 ----------
  const resp = await fetch(OTMC_SIGN_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(payload),
  });
  if (resp.redirected) {
    throw new Error(`请求被意外重定向至 ${resp.url}，请检查 Cloudflare 的 Redirect Rules 或 Page Rules`);
  }

  if (!resp.ok) {
    const text = await resp.text().catch(() => '');
    throw new Error(`远端签发失败：HTTP ${resp.status} ${text}`);
  }

  const data = await resp.json();
  console.log('requestRemoteSignature:: data:=<', data, '>');
  const pem = data.certificate || data.certPem || data.crt;
  if (!pem) throw new Error('远端响应缺少 certificate 字段');

  return {
    pem,
    serial: data.serial || '',
    issuer: data.issuer || '',
    notBefore: data.notBefore || '',
    notAfter: data.notAfter || '',
    isMock: false,
  };
}

/* ============================================================
 *  IndexedDB 层 —— 与 follower 页面共用同一个库，能自愈
 *
 *  - DB_VERSION 与 follower 页面保持一致（2）。
 *  - STORE_NAMES 是 **全站所有页面** 共用的 store 清单：
 *    打开时 onupgradeneeded 会把所有 store 都 ensure 一遍，
 *    因此任意页面先打开都能把整库建全，谁也不用单独 +1 版本。
 *  - 如果库里已有但缺少本页需要的 store（历史遗留库或新加
 *    了 store 却没升版本），不报错，而是在当前库版本基础上 +1
 *    升级一次补齐，然后正常返回可用连接。
 *  - 如果抛 VersionError（库里版本比 DB_VERSION 高，通常是
 *    follower 的自愈 +1 之后被抬高的），改用不带版本号打开，
 *    取当前版本再检查，仍缺则同样 +1 补建。
 *
 *  新增 store 时：把 store 名补进下面 STORE_NAMES，全站所有
 *  页面同步更新这一份清单即可（版本号无需手动加，自愈会处理）。
 * ============================================================ */
const DB_NAME = 'omtc-mtls-keystore';
const DB_VERSION = 1; // 与 follower 页面一致；库不存在时按此版本创建

const STORE_NAMES = [
  'browser_leader_cert_and_keys',
  'browser_follower_cert_and_keys',
  // 'browser_space_ca_cert_and_keys',
];

const STORE_NAME = 'browser_leader_cert_and_keys';

let dbPromise = null;

function ensureAllStores(db) {
  STORE_NAMES.forEach((name) => {
    if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
  });
}

function hasAllStores(db) {
  return STORE_NAMES.every((n) => db.objectStoreNames.contains(n));
}

function openRaw(name, version) {
  return new Promise((resolve, reject) => {
    let req;
    try {
      req = (version == null) ? indexedDB.open(name) : indexedDB.open(name, version);
    } catch (e) {
      return reject(e);
    }

    // 任何升级路径都建全 STORE_NAMES
    req.onupgradeneeded = () => ensureAllStores(req.result);

    req.onblocked = () => {
      const err = new Error('IndexedDB 升级被其他标签页阻塞，请关闭本站其他标签页后刷新重试');
      err.name = 'BlockedError';
      reject(err);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    req.onsuccess = () => resolve(req.result);
  });
}

async function openWithRepair() {
  let db;

  // 1) 按统一版本打开；库不存在会顺带创建并建全 store
  try {
    db = await openRaw(DB_NAME, DB_VERSION);
  } catch (e) {
    if (e && e.name === 'VersionError') {
      // 库里版本比 DB_VERSION 高（自愈 +1 后常见），按当前版本打开
      db = await openRaw(DB_NAME);
    } else {
      throw e;
    }
  }

  // 2) store 齐全 → 直接用
  if (hasAllStores(db)) return db;

  // 3) 缺 store → 在当前版本基础上 +1 升级补建
  const nextVersion = db.version + 1;
  db.close();

  const db2 = await openRaw(DB_NAME, nextVersion);
  if (!hasAllStores(db2)) {
    db2.close();
    throw new Error('IndexedDB 补建 object store 失败');
  }
  return db2;
}

function openDB() {
  if (dbPromise) return dbPromise;

  dbPromise = openWithRepair().then((db) => {
    db.onversionchange = () => { db.close(); dbPromise = null; };
    return db;
  });

  // 失败不缓存，允许用户刷新/重试后重新打开
  dbPromise.catch(() => { dbPromise = null; });
  return dbPromise;
}

async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('写入事务被中止'));
  });
}

async function dbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('删除事务被中止'));
  });
}

      extCsrInfo.value = null;
      extCsrError.value = '';
      extCsrVerify.value = '';
      resetExtResult();

      if (extParseTimer) { clearTimeout(extParseTimer); extParseTimer = null; }
      const text = (extCsrPem.value || '').trim();
      if (!text) return;

      extParseTimer = setTimeout(() => {
        extParseTimer = null;
        onParseExtCsr(true);
      }, 500);
    });

    async function onParseExtCsr(silent) {
      extCsrInfo.value = null;
      extCsrError.value = '';
      extCsrVerify.value = '';

      const text = (extCsrPem.value || '').trim();
      if (!text) {
        if (!silent) message.warning('请先粘贴其他设备的叶子证书 CSR');
        return;
      }

      let info;
      try {
        info = parseCsrPem(text);
      } catch (e) {
        extCsrError.value = 'CSR 解析失败：' + (e && e.message ? e.message : e);
        if (!silent) message.error(extCsrError.value);
        return;
      }

      extCsrInfo.value = info;

      try {
        const ok = await verifyCsrSignature(info);
        extCsrVerify.value = ok ? 'ok' : 'fail';
        if (!ok && !silent) {
          message.warning('CSR 自签名验证未通过，请确认 CSR 是否被修改');
        }
      } catch (e) {
        extCsrVerify.value = 'unsupported';
        console.warn('CSR 签名验证跳过：', e);
      }

      if (!silent) {
        message.success('CSR 解析成功：' + (info.subjectString || '(空 Subject)'));
      }
    }

    async function onSignExtCsr() {
      const info = extCsrInfo.value;
      if (!info) { message.warning('请先粘贴并解析其他设备的 CSR'); return; }
      if (!cryptoOk.value) { message.error('当前环境不支持 Web Crypto API'); return; }

      extSigning.value = true;
      try {
        // 用本机 Space 2nd-Level CA（recordKey: client-space-inter）私钥签发
        const caRecKey = 'client-space-inter';
        const caRec = await dbGet(caRecKey);
        if (!caRec || !caRec.privateKey) {
          throw new Error('本机没有找到 Space 2nd-Level CA 私钥，请先在该页签生成密钥对与 CSR');
        }

        const cert = await issueCertificate({
          subjectDer: info.subjectDer,              // 复用外部 CSR 的 Subject DER
          subjectSpki: info.spkiDer,                // 复用外部 CSR 的公钥 SPKI
          issuerAttrs: caRec.subjectAttrs,
          issuerSpki: toUint8Array(caRec.publicKeySpki),
          issuerPrivateKey: caRec.privateKey,
          isCa: false,
          pathLen: null,
        });

        let parsed = {};
        try {
          parsed = parseX509Pem(cert.pem);
        } catch (e) {
          console.warn('解析签发证书 PEM 失败', e);
        }

        extCertPem.value = cert.pem;
        Object.assign(extCertMeta, {
          serial: parsed.serial || cert.serial || '',
          issuer: parsed.issuer || caRec.subject || '',
          notBefore: parsed.notBefore || cert.notBefore || '',
          notAfter: parsed.notAfter || cert.notAfter || '',
        });

        // ===== 组装完整证书链：叶子 → 2 级 CA → 1 级 CA =====
        const chainParts = [cert.pem];
        const warnings = [];
        let hasInter = false;
        let hasTop = false;

        try {
          const interRec = await dbGet('client-space-inter');
          if (interRec && interRec.certPem) {
            chainParts.push(interRec.certPem);
            hasInter = true;
          } else {
            warnings.push('缺少 Space 2nd-Level CA 的已签发证书。请先切到「空间2级证书Space 2nd-Level CA」页签，用本机 1 级密钥完成签发。');
          }
        } catch (e) {
          console.warn('读取 2 级 CA 证书失败', e);
          warnings.push('读取 Space 2nd-Level CA 证书失败：' + (e && e.message ? e.message : e));
        }

        try {
          const topRec = await dbGet('client-space-top');
          if (topRec && topRec.certPem) {
            chainParts.push(topRec.certPem);
            hasTop = true;
          } else {
            warnings.push('缺少 Space 1st-Level CA 的已签发证书。请先切到「空间1级证书Space 1st-Level CA」页签，向 OTMC 总服务器获取签发证书。');
          }
        } catch (e) {
          console.warn('读取 1 级 CA 证书失败', e);
          warnings.push('读取 Space 1st-Level CA 证书失败：' + (e && e.message ? e.message : e));
        }

        extCertChainPem.value = chainParts.join('\n');
        extChainWarnings.value = warnings;
        extChainIncludes.inter = hasInter;
        extChainIncludes.top = hasTop;

        if (warnings.length === 0) {
          message.success('已用本机 Space 2nd-Level CA 为该 CSR 签发叶子证书，并组装完整证书链（叶子 → 2 级 CA → 1 级 CA）');
        } else {
          message.warning(`叶子证书已签发，但证书链不完整（缺少 ${warnings.length} 张上级证书）`);
        }
      } catch (e) {
        console.error(e);
        message.error('签发失败：' + (e && e.message ? e.message : e));
      } finally {
        extSigning.value = false;
      }
    }

    function onClearExt() {
      extCsrPem.value = '';
      extCsrInfo.value = null;
      extCsrError.value = '';
      extCsrVerify.value = '';
      resetExtResult();
      if (extParseTimer) { clearTimeout(extParseTimer); extParseTimer = null; }
    }

    const subjectString = computed(() =>
      subjectFields
        .filter((f) => form[f.key])
        .map((f) => `/${f.key}=${form[f.key]}`)
        .join('')
    );

    const signCommand = computed(() => {
      const t = currentType.value;
      return `openssl x509 -req \\
  -in ${t.filePrefix}.csr \\
  -CA ${t.caName}.crt \\
  -CAkey ${t.caName}.key \\
  -CAcreateserial \\
  -sha384 \\
  -days 36500 \\
  -out ${t.filePrefix}.crt \\
  -extfile ${t.filePrefix}.ext \\
  -extensions v3_req`;
    });

    /* 按证书类型变化的「签发」按钮文案 */
    const signButtonLabel = computed(() => {
      const k = currentTypeKey.value;
      if (k === 'space-top') return '获取 OTMC 签发证书';
      if (k === 'space-inter') return '用本机 1 级密钥签发证书';
      return '用本机 2 级密钥签发证书';
    });

    function resetResult() {
      Object.assign(result, {
        csrPem: '', publicKeyPem: '', subject: '', createdAt: '',
        certPem: '', certSerial: '', certIssuer: '',
        certNotBefore: '', certNotAfter: '', certIsMock: false,
      });
    }

    function fillFormFromAttrs(attrs) {
      if (!Array.isArray(attrs)) return;
      attrs.forEach((a) => { if (a.key in form) form[a.key] = a.value; });
    }

    async function checkStored() {
      if (!indexedDbOk.value) { hasStored.value = false; return false; }
      try {
        const record = await dbGet(currentType.value.recordKey);
        hasStored.value = !!(record && record.privateKey);
        return hasStored.value;
      } catch (e) {
        hasStored.value = false;
        return false;
      }
    }

    async function loadFromDb(silent) {
      const t = currentType.value;
      loading.value = true;
      try {
        const record = await dbGet(t.recordKey);
        if (!record || !record.privateKey) {
          hasStored.value = false;
          if (!silent) message.warning(`IndexedDB 中没有找到 ${t.label} 的密钥`);
          return false;
        }

        const csrPem = await buildCsrPem(
          record.subjectAttrs,
          record.publicKeySpki,
          record.privateKey
        );

        fillFormFromAttrs(record.subjectAttrs);

        // 若记录里只有 PEM、没有元数据（旧记录或远端签发场景），从 PEM 解析兜底
        let certSerial = record.certSerial || '';
        let certIssuer = record.certIssuer || '';
        let certNotBefore = record.certNotBefore || '';
        let certNotAfter = record.certNotAfter || '';
        if (record.certPem) {
          try {
            const p = parseX509Pem(record.certPem);
            certSerial = p.serial || certSerial;
            certIssuer = p.issuer || certIssuer;
            certNotBefore = p.notBefore || certNotBefore;
            certNotAfter = p.notAfter || certNotAfter;
          } catch (e) {
            console.warn('解析已存证书 PEM 失败（可能为 mock 证书）', e);
          }
        }

        Object.assign(result, {
          csrPem,
          publicKeyPem: pemFromDer(toUint8Array(record.publicKeySpki), 'PUBLIC KEY'),
          subject: record.subject || '',
          createdAt: record.createdAt || '',
          certPem: record.certPem || '',
          certSerial,
          certIssuer,
          certNotBefore,
          certNotAfter,
          certIsMock: false,
        });

        hasStored.value = true;
        if (!silent) message.success(`已从 IndexedDB 加载 ${t.label} 密钥并重新生成 CSR 签名`);
        return true;
      } catch (e) {
        console.error(e);
        if (!silent) message.error('加载失败：' + (e && e.message ? e.message : e));
        return false;
      } finally {
        loading.value = false;
      }
    }

    async function onTypeChange() {
      const t = currentType.value;

      Object.assign(form, t.subjectDefaults);
      resetResult();

      const stored = await checkStored();

      if (!stored) {
        message.info(`已切换到：${t.label}（IndexedDB 中暂无该类型密钥）`);
        return;
      }

      const ok = await loadFromDb(true);
      if (ok) {
        message.success(`已切换到：${t.label}，并从 IndexedDB 自动加载密钥与 CSR`);
      } else {
        message.warning(`已切换到：${t.label}，但自动加载失败，请点击“从 IndexedDB 加载”重试`);
      }
    }

    async function generateKeyPairAndStore() {
      const t = currentType.value;
      const attrs = subjectFields.map((f) => ({
        key: f.key,
        value: (form[f.key] || '').trim(),
      }));

      const keyPair = await crypto.subtle.generateKey(
        { name: 'ECDSA', namedCurve: 'P-384' },
        false,
        ['sign', 'verify']
      );

      const spki = new Uint8Array(
        await crypto.subtle.exportKey('spki', keyPair.publicKey)
      );

      const createdAt = new Date().toISOString();
      const subject = attrs
        .filter((a) => a.value)
        .map((a) => `/${a.key}=${a.value}`)
        .join('');

      await dbPut(t.recordKey, {
        version: 3,
        type: t.recordKey,
        isCa: t.isCa,
        pathLen: t.pathLen,
        extractable: false,
        algorithm: 'ECDSA P-384 / SHA-384',
        subject,
        subjectAttrs: attrs,
        createdAt,
        publicKeySpki: spki,
        privateKey: keyPair.privateKey,
      });

      return { keyPair, spki, attrs, subject, createdAt };
    }

    async function onGenerate() {
      if (!form.C || !form.O || !form.CN) {
        message.warning('请至少填写 C、O、CN');
        return;
      }
      if (!indexedDbOk.value) {
        message.error(dbError.value || 'IndexedDB 不可用，无法安全存储密钥');
        return;
      }

      loading.value = true;
      try {
        const { keyPair, spki, attrs, subject, createdAt } =
          await generateKeyPairAndStore();

        const csrPem = await buildCsrPem(attrs, spki, keyPair.privateKey);

        Object.assign(result, {
          csrPem,
          publicKeyPem: pemFromDer(spki, 'PUBLIC KEY'),
          subject,
          createdAt,
          certPem: '', certSerial: '', certIssuer: '',
          certNotBefore: '', certNotAfter: '', certIsMock: false,
        });

        hasStored.value = true;
        const label = currentType.value.label;
        message.success(`${label} 非导出密钥已生成并存入 IndexedDB，CSR 已生成`);
      } catch (e) {
        console.error(e);
        message.error('生成失败：' + (e && e.message ? e.message : e));
      } finally {
        loading.value = false;
      }
    }

    async function onLoad() {
      await loadFromDb(false);
    }

    /* ===== 签发证书 =====
     * 两条路径（远端 / 本地）签完后统一从 PEM 解析出 serial / issuer / notBefore / notAfter，
     * 再写回 IndexedDB 并赋值给 result，避免远端响应缺少元数据导致页面显示空白。
     */
    async function onSign() {
      const t = currentType.value;

      if (!result.csrPem) {
        message.warning('请先生成或从 IndexedDB 加载 CSR');
        return;
      }

      signing.value = true;
      try {
        let cert;

        if (t.remote) {
          /* --- 1 级 CA：由 OTMC 总服务器签发 --- */
          cert = await requestRemoteSignature(result.csrPem, t);
        } else {
          /* --- 2 级 CA / 叶子证书：用本机上级 CA 私钥本地签发 --- */
          const selfRec = await dbGet(t.recordKey);
          if (!selfRec || !selfRec.publicKeySpki) {
            throw new Error('本机没有找到该类型的公钥记录，请先点击「生成密钥对与 CSR」');
          }

          const parentRec = await dbGet(t.caName);
          if (!parentRec || !parentRec.privateKey) {
            throw new Error(
              `本机没有找到上级 CA（${t.caName}）的私钥。请先切换到「${CERT_TYPES[t.caName] ? CERT_TYPES[t.caName].label : t.caName}」，` +
              `生成并保存其密钥后再回来签发。`
            );
          }

          cert = await issueCertificate({
            subjectAttrs: selfRec.subjectAttrs,
            subjectSpki: toUint8Array(selfRec.publicKeySpki),
            issuerAttrs: parentRec.subjectAttrs,
            issuerSpki: toUint8Array(parentRec.publicKeySpki),
            issuerPrivateKey: parentRec.privateKey,
            isCa: t.isCa,
            pathLen: t.pathLen,
          });

          cert.issuer = parentRec.subject ||
            parentRec.subjectAttrs.filter((a) => a.value).map((a) => `/${a.key}=${a.value}`).join('');
        }

        // 统一从 PEM 解析元数据（远端响应可能只有 certificate 字段）
        let parsed = {};
        try {
          parsed = parseX509Pem(cert.pem);
        } catch (e) {
          console.warn('解析签发证书 PEM 失败（可能为 mock 证书）', e);
        }
        const finalSerial    = parsed.serial    || cert.serial    || '';
        const finalIssuer    = parsed.issuer    || cert.issuer    || '';
        const finalNotBefore = parsed.notBefore || cert.notBefore || '';
        const finalNotAfter  = parsed.notAfter  || cert.notAfter  || '';

        // 写回 IndexedDB（两条路径统一处理）
        try {
          const selfRec = await dbGet(t.recordKey);
          if (selfRec) {
            selfRec.certPem = cert.pem;
            selfRec.certSerial = finalSerial;
            selfRec.certIssuer = finalIssuer;
            selfRec.certNotBefore = finalNotBefore;
            selfRec.certNotAfter = finalNotAfter;
            selfRec.certIssuedAt = new Date().toISOString();
            await dbPut(t.recordKey, selfRec);
          }
        } catch (e) {
          console.warn('写回证书失败（不影响本次签发结果）', e);
        }

        Object.assign(result, {
          certPem: cert.pem,
          certSerial: finalSerial,
          certIssuer: finalIssuer,
          certNotBefore: finalNotBefore,
          certNotAfter: finalNotAfter,
          certIsMock: !!cert.isMock,
        });

        message.success(
          t.remote
            ? `${t.label} 获取 OTMC 签发证书`
            : `${t.label} 已用本机 ${t.caLabel} 密钥完成签发`
        );
      } catch (e) {
        console.error(e);
        message.error('签发失败：' + (e && e.message ? e.message : e));
      } finally {
        signing.value = false;
      }
    }

    async function onClear() {
      const t = currentType.value;
      try {
        await dbDelete(t.recordKey);
        hasStored.value = false;
        resetResult();
        message.success(`已清除 ${t.label} 的 IndexedDB 密钥`);
      } catch (e) {
        console.error(e);
        message.error('清除失败：' + (e && e.message ? e.message : e));
      }
    }

    async function copyText(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        message.success('已复制到剪贴板');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); message.success('已复制到剪贴板'); }
        catch (err) { message.error('复制失败，请手动选择文本'); }
        document.body.removeChild(ta);
      }
    }

    function downloadFile(filename, content) {
      if (!content) return;
      const blob = new Blob([content], { type: 'application/x-pem-file' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    onMounted(async () => {
      cryptoOk.value = !!(window.crypto && window.crypto.subtle);
      try {
        await openDB();
        indexedDbOk.value = true;
        dbError.value = '';
      } catch (e) {
        indexedDbOk.value = false;
        dbError.value = (e && e.message) ? e.message : String(e);
        console.warn('IndexedDB 不可用', e);
      }

      if (!indexedDbOk.value) return;

      const stored = await checkStored();
      if (!stored) return;

      const ok = await loadFromDb(true);
      if (ok) {
        message.success(`已从 IndexedDB 自动加载 ${currentType.value.label} 密钥与 CSR`);
      } else {
        message.warning(`检测到 ${currentType.value.label} 已保存的密钥，但自动加载失败，请点击“从 IndexedDB 加载”重试`);
      }
    });

    return {
      // 布局 / 导航
      isMobile, collapsed, drawerOpen, selectedKeys, toggleMenu,
      // 表单
      subjectFields, form, result, loading, signing, hasStored, cryptoOk, indexedDbOk, dbError,
      hasResult, subjectString,
      typeOptions, currentTypeKey, currentType, signCommand, signButtonLabel,
      dbName: DB_NAME,
      onTypeChange, onGenerate, onLoad, onSign, onClear,
      // 其他设备叶子 CSR 签发（含完整证书链）
      extCsrPem, extCsrInfo, extCsrError, extCsrVerify, extSigning,
      extCertPem, extCertChainPem, extChainWarnings, extChainIncludes,
      extCertMeta, extCertFileName, extChainFileName,
      onParseExtCsr, onSignExtCsr, onClearExt,
      copyText, downloadFile,
    };
  },
});

app.use(antd);
app.mount('#app');
</script>

</body>
</html>
