<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001529" />
  <title>OTMC 角色选择</title>

  <!-- antdv-next 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/antd.css" />

  <style>
    html, body { margin: 0; padding: 0; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 以下基础样式与 PC 原版完全一致 ===== */

    /* 侧边栏 Logo */
    .logo {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* 顶部栏 */
    .page-header {
      background: #001529;
      color: #fff;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .page-header .collapse-btn {
      color: #fff;
      font-size: 18px;
      padding: 0 8px;
    }
    .page-header .collapse-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    /* 内容区 */
    .page-content { max-width: 1120px; margin: 0 auto; padding: 24px; }

    .role-card {
      height: 100%; display: flex; flex-direction: column;
      background: #fff; border-radius: 8px; border: 1px solid #f0f0f0;
      padding: 24px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
    }
    .role-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
    .role-icon { font-size: 18px; line-height: 1; }
    .role-list {
      margin: 8px 0 0; padding-left: 20px;
      color: rgba(0, 0, 0, 0.65); line-height: 1.8;
    }
    .role-list li { margin-bottom: 4px; }
    .role-block-title {
      display: block; margin-top: 16px;
      font-weight: 600; color: rgba(0, 0, 0, 0.88);
    }
    .role-foot { margin-top: auto; padding-top: 20px; }
    .role-path {
      display: block; margin-top: 8px; text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; color: rgba(0, 0, 0, 0.45);
    }

    .row-flex { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
    .row-flex:last-child { margin-bottom: 0; }
    .col-flex { flex: 1; min-width: 300px; }
    .group-label {
      font-size: 14px; font-weight: 600; color: rgba(0, 0, 0, 0.65);
      margin: 0 0 12px; padding-left: 4px;
      border-left: 3px solid #1677ff;
    }

    /* ===== 移动端（≤768px）才应用的覆盖样式 ===== */
    @media (max-width: 768px) {
      .page-header {
        height: 56px;
        padding: 0 8px;
        font-size: 15px;
        gap: 4px;
        line-height: normal;
      }
      .page-header .collapse-btn {
        font-size: 18px;
        padding: 0 6px;
      }

      .page-content {
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      }

      /* 角色卡片纵向堆叠，去掉 300px 最小宽度以免横向溢出 */
      .row-flex {
        gap: 12px;
        margin-bottom: 12px;
      }
      .col-flex {
        flex: 1 1 100%;
        min-width: 0;
      }

      .role-card {
        height: auto;
        padding: 16px;
      }
      .role-title { font-size: 15px; }
      .role-list { font-size: 13px; padding-left: 18px; line-height: 1.7; }
      .role-block-title { margin-top: 12px; font-size: 13px; }
      .group-label { font-size: 13px; margin-bottom: 8px; }

      .role-foot { padding-top: 14px; }
      .role-path { font-size: 11px; word-break: break-all; line-height: 1.4; }

      /* 触摸目标更大 */
      .ant-btn { min-height: 36px; }
      .ant-alert { padding: 10px 12px; }
    }

    @media (max-width: 480px) {
      .page-header { font-size: 14px; }
      .role-card { padding: 14px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script type="text/x-template" id="app-template">
  <a-layout style="min-height: 100vh">

    <!-- 桌面端左侧菜单：结构与原版一致 -->
    <a-layout-sider
      v-if="!isMobile"
      v-model:collapsed="collapsed"
      collapsible
      :trigger="null"
      :width="208"
      theme="dark"
    >
      <div class="logo">{{ collapsed ? '导航' : 'OTMC 导航' }}</div>

      <a-menu theme="dark" mode="inline" :selected-keys="selectedKeys">
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-layout-sider>

    <!-- 移动端抽屉导航（PC 不渲染） -->
    <a-drawer
      v-if="isMobile"
      v-model:open="drawerOpen"
      placement="left"
      :width="230"
      :closable="false"
      :styles="{ body: { padding: 0, background: '#001529' } }"
    >
      <div class="logo">OTMC 导航</div>
      <a-menu
        theme="dark"
        mode="inline"
        :selected-keys="selectedKeys"
        @click="drawerOpen = false"
      >
        <a-menu-item key="overview">
          <a href="/" rel="noopener" style="display: block">🏠 首页</a>
        </a-menu-item>
        <a-menu-item key="setup">
          <a href="/setup" rel="noopener" style="display: block">⚙️ 设置</a>
        </a-menu-item>
      </a-menu>
    </a-drawer>

    <!-- 右侧主体 -->
    <a-layout>
      <a-layout-header class="page-header">
        <!-- PC 切换侧栏折叠；手机打开抽屉 -->
        <a-button type="text" class="collapse-btn" @click="toggleMenu">☰</a-button>
        <span>OTMC 设定角色选择</span>
      </a-layout-header>

      <a-layout-content>
        <div class="page-content">
          <a-alert
            type="info"
            show-icon
            message="OTMC角色分类"
            description="领头者负责建立信任根、逐级签发证书，并为跟随者出具身份证书；跟随者加入一个已经存在的 OTMC Space，只生成自己的终端密钥并提交 CSR 等待签发。两者初始化流程不同，请按实际部署规划选择。
            边缘设备主要是指运行linux的终端系统，和OTMC服务器通过TCP或者QUIC的MQTT连接，浏览器设备主要是运行的Chrome等浏览器上，主要通过websocket的MQTT连接"
            style="margin-bottom: 24px"
          />

          <!-- 外层按组循环，每组一行 -->
          <template v-for="group in groups" :key="group.key">
            <div class="group-label">{{ group.label }}</div>
            <div class="row-flex">
              <div class="col-flex" v-for="role in group.roles" :key="role.key">
                <div class="role-card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span class="role-title">
                      <span class="role-icon">{{ role.icon }}</span>
                      <span>{{ role.title }}</span>
                    </span>
                    <a-tag :color="role.tagColor">{{ role.tag }}</a-tag>
                  </div>

                  <p style="color: rgba(0, 0, 0, 0.88); margin-top: 0; line-height: 1.6;">{{ role.summary }}</p>

                  <span class="role-block-title">核心职责</span>
                  <ul class="role-list">
                    <li v-for="(p, i) in role.points" :key="i">{{ p }}</li>
                  </ul>

                  <span class="role-block-title">适用场景</span>
                  <p style="color: rgba(0, 0, 0, 0.45); margin: 4px 0 0; line-height: 1.5;">
                    {{ role.scenario }}
                  </p>

                  <a-alert
                    :type="role.warnType"
                    show-icon
                    :message="role.warn"
                    style="margin-top: 16px"
                  />

                  <div class="role-foot">
                    <a-button
                      type="primary"
                      size="large"
                      block
                      :href="role.href"
                    >
                      {{ role.buttonText }}
                    </a-button>
                    <span class="role-path">{{ role.href }}</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </a-layout-content>
    </a-layout>

  </a-layout>
</script>

<!-- 1. Day.js UMD 及插件 -->
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/customParseFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/weekday.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/localeData.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/weekOfYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/weekYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/advancedFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/quarterOfYear.js"></script>
<script>
  dayjs.extend(dayjs_plugin_customParseFormat);
  dayjs.extend(dayjs_plugin_weekday);
  dayjs.extend(dayjs_plugin_localeData);
  dayjs.extend(dayjs_plugin_weekOfYear);
  dayjs.extend(dayjs_plugin_weekYear);
  dayjs.extend(dayjs_plugin_advancedFormat);
  dayjs.extend(dayjs_plugin_quarterOfYear);
</script>

<!-- 2. Vue 3 全局构建 -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"></script>

<!-- 3. antdv-next UMD -->
<script src="https://cdn.jsdelivr.net/npm/antdv-next@1.7.0/dist/antd.js"></script>

<!-- 4. 业务脚本 -->
<script>
  const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

  // 公共文案，避免重复
  const leaderBase = {
    icon: '👑',
    tagColor: 'gold',
    points: [
      '生成 Space 1st-Level CA / 2nd-Level CA 的密钥对与 CSR',
      '用上级 CA 签发下级 CA 证书，维护完整的信任链',
      '为跟随者提交的 CSR 签发终端证书（clientAuth 用途）',
      '保管根 CA 私钥，制定证书有效期与吊销策略',
    ],
    scenario:
      '首次部署 OTMC Space、需要自行掌控整条证书签发链的网络拥有者或运维方。',
    warnType: 'warning',
  };

  const followerBase = {
    icon: '🔗',
    tagColor: 'blue',
    points: [
      '生成本机终端密钥对（不可导出）与 CSR',
      '把 CSR 提交给所在 Space 的领头者 / 签发 CA',
      '导入签发得到的终端证书与中间证书链',
      '使用 mTLS 连接 MQTT Broker，仅需保管自身终端私钥',
    ],
    scenario:
      '普通 MQTT 客户端节点，或证书由上级 Space / 其他团队统一签发的场景。',
    warnType: 'info',
  };

  const app = createApp({
    template: '#app-template',
    setup() {
      /* ===== 响应式断点（仅 ≤768px 触发） ===== */
      const mqMobile = window.matchMedia('(max-width: 768px)');
      const isMobile = ref(mqMobile.matches);

      /* ===== 导航状态 ===== */
      const collapsed = ref(false);   // PC 端侧栏折叠
      const drawerOpen = ref(false);  // 移动端抽屉
      const selectedKeys = ref(['setup']); // 当前页面在 /setup 下

      const toggleMenu = () => {
        if (isMobile.value) {
          drawerOpen.value = !drawerOpen.value;
        } else {
          collapsed.value = !collapsed.value; // PC 行为与原版一致
        }
      };

      const onMediaChange = (e) => {
        isMobile.value = e.matches;
        if (!e.matches) drawerOpen.value = false;
      };

      onMounted(() => {
        if (mqMobile.addEventListener) {
          mqMobile.addEventListener('change', onMediaChange);
        } else if (mqMobile.addListener) {
          mqMobile.addListener(onMediaChange);
        }
      });

      onBeforeUnmount(() => {
        if (mqMobile.removeEventListener) {
          mqMobile.removeEventListener('change', onMediaChange);
        } else if (mqMobile.removeListener) {
          mqMobile.removeListener(onMediaChange);
        }
      });

      const groups = [
        {
          key: 'edge',
          label: '边缘设备',
          roles: [
            {
              key: 'edge-leader',
              ...leaderBase,
              title: '领头者角色 · 边缘设备',
              tag: 'Leader edge',
              href: '/setup/edge/leader/',
              buttonText: '进入领头者初始化 · 边缘设备',
              warn:
                'CA 私钥属于高价值密钥，建议在离线环境或 HSM 中生成与保管；一旦泄露，整条信任链将失效。',
              summary:
                '领头者是 OTMC Space 中信任根的建立者与维护者。它负责生成 Space 级 CA 密钥对，' +
                '逐级签发下级 CA 证书，并为加入网络的跟随者出具终端身份证书。',
            },
            {
              key: 'edge-follower',
              ...followerBase,
              title: '跟随者角色 · 边缘设备',
              tag: 'Follower edge',
              href: '/setup/edge/follower/',
              buttonText: '进入跟随者初始化 · 边缘设备',
              warn:
                '终端私钥只保存在本机存储中，建议HSM 中生成与保管；一旦泄露，整条信任链将失效。',
              summary:
                '跟随者是加入一个已经建立好的 OTMC Space 的客户端。它不持有任何 CA 私钥，' +
                '只需生成本机终端密钥对并把 CSR 提交给领头者签发，随后凭签发的证书链以 mTLS 接入 Broker。',
            },
          ],
        },
        {
          key: 'browser',
          label: '浏览器设备',
          roles: [
            {
              key: 'browser-leader',
              ...leaderBase,
              title: '领头者角色 · 浏览器',
              tag: 'Leader browser',
              href: '/setup/browser/leader/',
              buttonText: '进入领头者初始化',
              warn:
                'CA 私钥属于高价值密钥，千万不要导出；一旦泄露，整条信任链将失效。私钥只保存在本机浏览器存储中，清除浏览器数据后将无法恢复，需要重新申请签发。',
              summary:
                '领头者是 OTMC Space 中信任根的建立者与维护者。它负责生成 Space 级 CA 密钥对，' +
                '逐级签发下级 CA 证书，并为加入网络的跟随者出具终端身份证书。',
            },
            {
              key: 'browser-follower',
              ...followerBase,
              title: '跟随者角色 · 浏览器',
              tag: 'Follower browser',
              href: '/setup/browser/follower/',
              buttonText: '进入跟随者初始化',
              warn:
                '终端私钥只保存在本机浏览器存储中，清除浏览器数据后将无法恢复，需要重新申请签发。',
              summary:
                '跟随者是加入一个已经建立好的 OTMC Space 的客户端。它不持有任何 CA 私钥，' +
                '只需生成本机终端密钥对并把 CSR 提交给领头者签发，随后凭签发的证书链以 mTLS 接入 Broker。',
            },
          ],
        },
      ];

      return { collapsed, drawerOpen, selectedKeys, isMobile, toggleMenu, groups };
    }
  });

  app.use(antd);
  app.mount('#app');
</script>

</body>
</html>
