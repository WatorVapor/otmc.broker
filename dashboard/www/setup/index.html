<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTMC Client 初始化 · 角色选择</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ant-design-vue@4.2.6/dist/reset.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #f0f2f5; }
    .page-header {
      background: #001529; color: #fff; height: 64px; padding: 0 24px;
      display: flex; align-items: center; font-size: 17px; font-weight: 600;
    }
    .page-content { max-width: 1120px; margin: 0 auto; padding: 24px; }
    .role-card { height: 100%; display: flex; flex-direction: column; }
    .role-card .ant-card-body { flex: 1; display: flex; flex-direction: column; }
    .role-title { display: flex; align-items: center; gap: 8px; }
    .role-icon { font-size: 18px; line-height: 1; }
    .role-list {
      margin: 8px 0 0; padding-left: 20px;
      color: rgba(0, 0, 0, 0.65); line-height: 1.8;
    }
    .role-list li { margin-bottom: 4px; }
    .role-block-title {
      display: block; margin-top: 16px;
      font-weight: 600; color: rgba(0, 0, 0, 0.88);
    }
    .role-foot { margin-top: auto; padding-top: 20px; }
    .role-path {
      display: block; margin-top: 8px; text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; color: rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>

<div id="app">
  <div class="page-header">OTMC Client 初始化 · 角色选择</div>

  <div class="page-content">

    <a-alert
      type="info"
      show-icon
      message="请选择本机 OTMC Client 的角色"
      description="领头者负责建立信任根、逐级签发证书，并为跟随者出具身份证书；跟随者加入一个已经存在的 OTMC Space，只生成自己的终端密钥并提交 CSR 等待签发。两者初始化流程不同，请按实际部署规划选择。"
      style="margin-bottom: 24px"
    />

    <a-row :gutter="[24, 24]">
      <a-col :xs="24" :md="12" v-for="role in roles" :key="role.key">
        <a-card class="role-card">

          <template #title>
            <span class="role-title">
              <span class="role-icon">{{ role.icon }}</span>
              <span>{{ role.title }}</span>
            </span>
          </template>

          <template #extra>
            <a-tag :color="role.tagColor">{{ role.tag }}</a-tag>
          </template>

          <a-typography-paragraph>{{ role.summary }}</a-typography-paragraph>

          <span class="role-block-title">核心职责</span>
          <ul class="role-list">
            <li v-for="(p, i) in role.points" :key="i">{{ p }}</li>
          </ul>

          <span class="role-block-title">适用场景</span>
          <a-typography-paragraph type="secondary" style="margin: 4px 0 0">
            {{ role.scenario }}
          </a-typography-paragraph>

          <a-alert
            :type="role.warnType"
            show-icon
            :message="role.warn"
            style="margin-top: 16px"
          />

          <div class="role-foot">
            <a-button
              type="primary"
              size="large"
              block
              :href="role.href"
            >
              {{ role.buttonText }}
            </a-button>
            <span class="role-path">{{ role.href }}</span>
          </div>

        </a-card>
      </a-col>
    </a-row>

  </div>
</div>

<!-- 1. Day.js + 插件（Ant Design Vue UMD 依赖全局 dayjs，必须在 antd 之前加载） -->
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/customParseFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekday.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/localeData.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekOfYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/advancedFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/quarterOfYear.js"></script>
<script>
  dayjs.extend(dayjs_plugin_customParseFormat);
  dayjs.extend(dayjs_plugin_weekday);
  dayjs.extend(dayjs_plugin_localeData);
  dayjs.extend(dayjs_plugin_weekOfYear);
  dayjs.extend(dayjs_plugin_weekYear);
  dayjs.extend(dayjs_plugin_advancedFormat);
  dayjs.extend(dayjs_plugin_quarterOfYear);
</script>

<!-- 2. Vue 3 全局构建 -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

<!-- 3. Ant Design Vue V4 UMD（依赖上一步的全局 dayjs） -->
<script src="https://cdn.jsdelivr.net/npm/ant-design-vue@4.2.6/dist/antd.min.js"></script>

<!-- 4. 业务脚本 -->
<script>
const { createApp } = Vue;

const app = createApp({
  setup() {
    const roles = [
      {
        key: 'leader',
        icon: '👑',
        title: '领头者角色',
        tag: 'Leader',
        tagColor: 'gold',
        href: '/setup/leader/',
        buttonText: '进入领头者初始化',
        summary:
          '领头者是 OTMC Space 中信任根的建立者与维护者。它负责生成 Space 级 CA 密钥对，' +
          '逐级签发下级 CA 证书，并为加入网络的跟随者出具终端身份证书。',
        points: [
          '生成 Space 1st-Level CA / 2nd-Level CA 的密钥对与 CSR',
          '用上级 CA 签发下级 CA 证书，维护完整的信任链',
          '为跟随者提交的 CSR 签发终端证书（clientAuth 用途）',
          '保管根 CA 私钥，制定证书有效期与吊销策略',
        ],
        scenario:
          '首次部署 OTMC Space、需要自行掌控整条证书签发链的网络拥有者或运维方。',
        warn:
          'CA 私钥属于高价值密钥，建议在离线环境或 HSM 中生成与保管；一旦泄露，整条信任链将失效。',
        warnType: 'warning',
      },
      {
        key: 'follower',
        icon: '🔗',
        title: '跟随者角色',
        tag: 'Follower',
        tagColor: 'blue',
        href: '/setup/follower/',
        buttonText: '进入跟随者初始化',
        summary:
          '跟随者是加入一个已经建立好的 OTMC Space 的客户端。它不持有任何 CA 私钥，' +
          '只需生成本机终端密钥对并把 CSR 提交给领头者签发，随后凭签发的证书链以 mTLS 接入 Broker。',
        points: [
          '生成本机终端密钥对（不可导出）与 CSR',
          '把 CSR 提交给所在 Space 的领头者 / 签发 CA',
          '导入签发得到的终端证书与中间证书链',
          '使用 mTLS 连接 MQTT Broker，仅需保管自身终端私钥',
        ],
        scenario:
          '普通 MQTT 客户端节点，或证书由上级 Space / 其他团队统一签发的场景。',
        warn:
          '终端私钥只保存在本机浏览器存储中，清除浏览器数据后将无法恢复，需要重新申请签发。',
        warnType: 'info',
      },
    ];

    return { roles };
  },
});

app.use(antd);
app.mount('#app');
</script>

</body>
</html>
