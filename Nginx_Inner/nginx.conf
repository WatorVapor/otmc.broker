worker_processes  1;

events {
    worker_connections  1024;
}

# 注意：这是 stream 块，与 http 块平级
stream {
    log_format mqtt_proxy '$remote_addr [$time_local] $protocol '
                          '$status $bytes_sent $bytes_received '
                          '$session_time "$upstream_addr"';
    access_log /dev/stdout mqtt_proxy;
    error_log  /dev/stderr debug;


    upstream mqtt_backend {
        # 后端 MQTT Broker 地址（这里以本地 Mosquitto 为例）
        server 127.0.0.1:21883;
    }

    server {
        # 监听 18883 端口并开启 SSL
        listen 18883 ssl;
        listen [::]:18883 ssl;

        # --- 服务端证书配置 ---
        ssl_certificate      /usr/local/etc/certs/server_cert/fullchain.crt;
        ssl_certificate_key  /usr/local/etc/certs/server_cert/server-leaf.key;

        # --- mTLS 客户端验证配置 ---
        ssl_client_certificate /usr/local/etc/certs/client_cert/client-root.crt;
        ssl_verify_client      on; # 强制验证客户端证书
        ssl_verify_depth       6;
        
        #proxy_pass mqtt_backend;
    }
}
