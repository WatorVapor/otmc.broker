services:
  envoy:
    image: envoyproxy/envoy:v1.38.0
    volumes:
      - ./Envoy_Gate/envoy.yaml:/etc/envoy/envoy.yaml
      - mqtt_socket:/var/run/mqtt              # 挂载共享卷，与 broker 共用
    ports:
      - "1884:1884"   # Envoy 监听端口，客户端连接此处
      - "9901:9901"   # 管理端口（可选）
    depends_on:
      - mqtt-broker
    # 如果 Envoy 容器内无法连接 socket（如权限不足），可临时用 root 运行
    # user: "0:0"
    command: envoy -c /etc/envoy/envoy.yaml

  mqtt-broker:
    build:
      context: ./
      dockerfile: ./CXX_Broker/Dockerfile.runtime
    volumes:
      - mqtt_socket:/var/run/mqtt              # 同一共享卷，broker 在此创建 socket 文件
    environment:
      - SOCKET_PATH=/var/run/mqtt/broker.external.sock  # 假设您的 broker 通过环境变量指定路径

volumes:
  mqtt_socket:   # 定义共享卷，用于传递 Unix socket 文件
