services:
  haproxy:
    #image: haproxy:lts-alpine
    build: ./HAProxy_Gate
    container_name: otmc-haproxy
    volumes:
      - ./HAProxy_Gate/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./HAProxy_Gate/lua:/usr/local/etc/haproxy/lua:ro
      - ./HAProxy_Gate/backends:/usr/local/etc/haproxy/backends
      - /opt/otmc-deploy/otmc.secret/broker/server_cert:/usr/local/etc/certs/server_cert:ro
      - /opt/otmc-deploy/otmc.secret/broker/client_cert:/usr/local/etc/certs/client_cert:ro
      - /opt/otmc-deploy/otmc.secret/broker/internal_cert:/usr/local/etc/certs/internal_cert:ro
      - /opt/otmc-deploy/otmc.secret/broker/valkey-cluster:/usr/local/etc/certs/valkey-cluster:ro
      - /dev/shm/haproxy:/var/run/haproxy
      # 挂载共享卷，与 broker 共用
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-f", "/usr/local/etc/haproxy/backends/"]
    network_mode : "host"
    #ports:
      # nginx 监听端口，客户端连接此处
      #- "8883:8883"
    depends_on:
      - mqtt-broker-nodejs

  haproxy-syncbackend:
    container_name: otmc-haproxy-syncbackend
    image: node:26
    volumes:
      - ./HAProxy_Gate/dynamic-backend:/app
      - ./HAProxy_Gate/backends:/usr/local/etc/haproxy/backends
      - /opt/otmc-deploy/otmc.secret/broker/valkey-cluster:/usr/local/etc/certs/valkey-cluster:ro
      - /dev/shm/haproxy:/var/run/haproxy
    working_dir: /app
    command: node ./index.mjs
    network_mode : "host"

  nginx-inner:
    image: nginx:alpine
    container_name: otmc-nginx-inner
    volumes:
      - ./Nginx_Inner/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/otmc-deploy/otmc.secret/broker/server_cert:/usr/local/etc/certs/server_cert:ro
      - /opt/otmc-deploy/otmc.secret/broker/client_cert:/usr/local/etc/certs/client_cert:ro
      - /opt/otmc-deploy/otmc.secret/broker/internal_cert:/usr/local/etc/certs/internal_cert:ro
      - /dev/shm/otmc/:/var/run/otmc/
    network_mode : "host"
    depends_on:
      - haproxy

  mqtt-broker-nodejs:
    container_name: otmc-mqtt-broker-nodejs
    image: node:26
    volumes:
      - ./Nodejs_Broker:/app
      - /opt/otmc-deploy/otmc.secret/broker/valkey-cluster:/usr/local/etc/certs/valkey-cluster:ro
      - /dev/shm/otmc/:/var/run/otmc/
    working_dir: /app
    command: node ./index.mjs
    network_mode : "host"

  valkey:
    image: valkey/valkey:9.1
    container_name: otmc-valkey
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf
      - ./valkey_data:/data
    command: valkey -c /etc/valkey/valkey.conf


volumes:
  # 定义共享卷，用于传递 Unix socket 文件
  valkey_data: